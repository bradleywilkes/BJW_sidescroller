//----------------------------------------------------------------------

function px(pal, rows, scale) {
  scale = scale || 2;
  const c = document.createElement('canvas');
  c.width = rows[0].length * scale; c.height = rows.length * scale;
  const g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
    const col = pal[rows[y][x]];
    if (col) { g.fillStyle = col; g.fillRect(x * scale, y * scale, scale, scale); }
  }
  return c;
}

//----------------------------------------------------------------------
// AUDIO -- WebAudio bleeps + a little looping chiptune
//----------------------------------------------------------------------
const AU = {
  ctx: null, music: true, mGain: null, mTimer: null, step: 0,
  init(){
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return; }
    this.mGain = this.ctx.createGain();
    this.mGain.gain.value = 0.16;
    this.mGain.connect(this.ctx.destination);
    this.startMusic();
  },
  tone(f0, f1, dur, type, vol, when){
    if (!this.ctx) return;
    const t = (when || this.ctx.currentTime);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, hp){
    if (!this.ctx) return;
    const n = this.ctx.sampleRate * dur, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 500;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start();
  },
  jump(){ this.tone(220, 520, 0.14, 'square', 0.10); },
  coin(){ this.tone(988, 988, 0.06, 'square', 0.10); this.tone(1319, 1319, 0.16, 'square', 0.10, this.ctx && this.ctx.currentTime + 0.06); },
  gem(){ [660, 880, 1109, 1319].forEach((f, i) => this.tone(f, f, 0.11, 'square', 0.09, this.ctx && this.ctx.currentTime + i * 0.05)); },
  stomp(){ this.tone(320, 70, 0.16, 'square', 0.14); },
  slash(){ this.noise(0.12, 0.16, 1200); },
  hurt(){ this.tone(400, 70, 0.3, 'sawtooth', 0.14); },
  pickup(){ [523, 659, 784].forEach((f, i) => this.tone(f, f, 0.12, 'triangle', 0.12, this.ctx && this.ctx.currentTime + i * 0.06)); },
  checkpoint(){ [587, 880].forEach((f, i) => this.tone(f, f, 0.15, 'square', 0.10, this.ctx && this.ctx.currentTime + i * 0.09)); },
  die(){ [392, 330, 262, 196].forEach((f, i) => this.tone(f, f, 0.18, 'square', 0.11, this.ctx && this.ctx.currentTime + i * 0.14)); },
  win(){ [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, f, 0.16, 'square', 0.11, this.ctx && this.ctx.currentTime + i * 0.12)); },
  // -- music: 4 bars of A-minor wandering-hero loop --
  LEAD: [440,0,523,659,880,0,784,659, 698,0,659,587,659,0,523,440,
         494,0,587,698,880,0,784,698, 659,0,587,523,587,0,494,392],
  BASS: [110,110,110,110,87,87,87,87, 98,98,98,98,82,82,82,82,
         110,110,110,110,87,87,87,87, 98,98,98,98,82,82,82,82],
  startMusic(){
    if (this.mTimer || !this.ctx) return;
    const stepDur = 60 / 152 / 2; // 8th notes @ 152bpm
    this.mTimer = setInterval(() => {
      if (!this.music) return;
      const t = this.ctx.currentTime + 0.05;
      const i = this.step % 32;
      const lead = this.LEAD[i], bass = this.BASS[i];
      if (lead) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = lead;
        g.gain.setValueAtTime(0.045, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 0.9);
        o.connect(g); g.connect(this.mGain); o.start(t); o.stop(t + stepDur);
      }
      if (i % 4 === 0) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = bass;
        g.gain.setValueAtTime(0.14, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 3.6);
        o.connect(g); g.connect(this.mGain); o.start(t); o.stop(t + stepDur * 4);
      }
      this.step++;
    }, stepDur * 1000);
  },
};

const keys = {};

  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump',
  KeyX:'atk', KeyJ:'atk', KeyK:'atk',
  Enter:'start', KeyM:'mute', KeyP:'pause',
};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  AU.init();
  if (!keys[a]) keys[a + 'Hit'] = true;
  keys[a] = true;
  if (a === 'mute') { AU.music = !AU.music; }
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) keys[a] = false; });
// touch controls

  document.body.classList.add('touch');
  const bind = (id, act) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); AU.init();
      if (!keys[act]) keys[act + 'Hit'] = true; keys[act] = true; keys.startHit = keys.startHit || act === 'jump'; }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); keys[act] = false; }, {passive:false});
  };
  bind('bL', 'left'); bind('bR', 'right'); bind('bA', 'jump'); bind('bB', 'atk');
  cvs.addEventListener('touchstart', () => { AU.init(); keys.startHit = true; });
}

//----------------------------------------------------------------------

//----------------------------------------------------------------------
const grid = ROWS.map(r => r.split(''));

let cam = {x: 0, shake: 0};
let player, enemies = [], items = [], particles = [], popups = [];
let spawn = {x: 64, y: 64}, checkpoint = null, goal = {x: 0, y: 0};
let score = 0, coins = 0, lives = 3, best = 0;
let winTimer = 0, deadTimer = 0, paused = false;
try { best = +(localStorage.getItem('ember_best') || 0); } catch (e) {}

const enemySpawns = [], itemSpawns = [], checkpoints = [];
for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
  const ch = grid[y][x], wx = x * TS, wy = y * TS;
  if ('csgbhkP*F'.includes(ch)) grid[y][x] = '.';
  if (ch === 'P') spawn = {x: wx + 5, y: wy - 4};
  else if (ch === 'F') goal = {x: wx, y: wy};
  else if (ch === '*') checkpoints.push({x: wx, y: wy, on: false});
  else if (ch === 'c' || ch === 'g' || ch === 'h') itemSpawns.push({x: wx, y: wy, kind: ch});
  else if (ch === 's' || ch === 'b' || ch === 'k') enemySpawns.push({x: wx, y: wy, kind: ch});
}

function makeEnemy(sp){
  if (sp.kind === 's') return {kind:'s', x:sp.x+2, y:sp.y, w:26, h:15, vx:-0.55, vy:0, dir:-1, t:0, dead:false};
  if (sp.kind === 'k') return {kind:'k', x:sp.x+4, y:sp.y, w:22, h:27, vx:-1.1, vy:0, dir:-1, t:0, dead:false};
  return {kind:'b', x:sp.x+2, y:sp.y, w:26, h:12, ax:sp.x+2, ay:sp.y, t:Math.random()*99, dead:false};
}
function resetLevel(fromCheckpoint){
  enemies = enemySpawns.map(makeEnemy);
  particles = []; popups = [];
  if (!fromCheckpoint) {
    items = itemSpawns.map(s => ({...s, taken: false, t: Math.random() * 9}));
    checkpoints.forEach(c => c.on = false);
    checkpoint = null; coins = 0; score = 0; playTime = 0; lives = 3;
  }
  const at = (fromCheckpoint && checkpoint) || spawn;
  player = {x: at.x, y: at.y, w: 20, h: 34, vx: 0, vy: 0, dir: 1,
    onGround: false, coyote: 0, jumpBuf: 0, hp: 3, inv: 0,
    atk: 0, atkCd: 0, animT: 0, dead: false};
  cam.x = Math.max(0, Math.min(player.x - VW * 0.35, LW * TS - VW));
}

//----------------------------------------------------------------------
// PHYSICS
//----------------------------------------------------------------------
const tileAt = (tx, ty) => (tx < 0 || tx >= LW) ? '#' : (ty < 0 || ty >= LH) ? '.' : grid[ty][tx];
const isSolid = (tx, ty) => tileAt(tx, ty) === '#';

function moveX(e, dx){
  e.x += dx;
  const t0 = Math.floor(e.y / TS), t1 = Math.floor((e.y + e.h - 1) / TS);
  if (dx > 0) {
    const tx = Math.floor((e.x + e.w) / TS);
    for (let ty = t0; ty <= t1; ty++) if (isSolid(tx, ty)) { e.x = tx * TS - e.w - 0.01; e.vx = 0; return true; }
  } else if (dx < 0) {
    const tx = Math.floor(e.x / TS);
    for (let ty = t0; ty <= t1; ty++) if (isSolid(tx, ty)) { e.x = (tx + 1) * TS + 0.01; e.vx = 0; return true; }
  }
  return false;
}
function moveY(e, dy){
  const prevBottom = e.y + e.h;
  e.y += dy;
  const c0 = Math.floor(e.x / TS), c1 = Math.floor((e.x + e.w - 1) / TS);
  if (dy > 0) {
    const ty = Math.floor((e.y + e.h) / TS);
    for (let tx = c0; tx <= c1; tx++) {
      const t = tileAt(tx, ty);
      if (t === '#' || (t === '=' && prevBottom <= ty * TS + 0.5)) {
        e.y = ty * TS - e.h - 0.01; e.vy = 0; return 'floor';
      }
    }
  } else if (dy < 0) {
    const ty = Math.floor(e.y / TS);
    for (let tx = c0; tx <= c1; tx++) if (isSolid(tx, ty)) { e.y = (ty + 1) * TS + 0.01; e.vy = 0; return 'ceil'; }
  }
  return null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function groundAhead(e){
  const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
  const ty = Math.floor((e.y + e.h + 4) / TS), tx = Math.floor(fx / TS);
  const t = tileAt(tx, ty);
  return t === '#' || t === '=';
}

//----------------------------------------------------------------------
function burst(x, y, color, n, spread){
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: (Math.random() - 0.5) * (spread || 4), vy: -Math.random() * 3.5 - 0.5,
    life: 25 + Math.random() * 20, color, size: 2 + Math.random() * 3, grav: 0.18,
  });
}
function popup(x, y, txt, color){ popups.push({x, y, txt, color: color || '#ffe08a', life: 45}); }
function addScore(n, x, y){ score += n; if (x !== undefined) popup(x, y, '+' + n); }

//----------------------------------------------------------------------
// UPDATE
//----------------------------------------------------------------------
function killPlayer(){
  if (player.dead) return;
  player.dead = true; player.vy = -9; deadTimer = 0;
  AU.die();
}
function hurtPlayer(fromX){
  if (player.inv > 0 || player.dead) return;
  player.hp--;
  AU.hurt(); cam.shake = 10;
  burst(player.x + 10, player.y + 15, '#e84a5f', 10);
  if (player.hp <= 0) { killPlayer(); return; }
  player.inv = 90;
  player.vy = -6;
  player.vx = (player.x + player.w / 2 < fromX ? -1 : 1) * 5;
}
function updatePlayer(){
  const p = player;
  if (p.dead) { // death tumble
    p.vy += 0.4; p.y += p.vy; deadTimer++;
    if (deadTimer > 90) {
      lives--;
      if (lives <= 0) { state = 'gameover'; if (score > best) { best = score; try { localStorage.setItem('ember_best', best); } catch (e) {} } }
      else resetLevel(true);
    }
    return;
  }
  // horizontal
  const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = want * 4.4;
  p.vx += (target - p.vx) * (p.onGround ? 0.25 : 0.12);
  if (Math.abs(p.vx) < 0.05) p.vx = 0;
  if (want) p.dir = want;
  // jump
  p.coyote = p.onGround ? 7 : Math.max(0, p.coyote - 1);
  p.jumpBuf = keys.jumpHit ? 8 : Math.max(0, p.jumpBuf - 1);
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -11.8; p.coyote = 0; p.jumpBuf = 0;
    AU.jump(); burst(p.x + 10, p.y + p.h, '#c9b79a', 5, 3);
  }
  if (!keys.jump && p.vy < -4) p.vy *= 0.82; // variable jump height
  // attack
  if (p.atkCd > 0) p.atkCd--;
  if (p.atk > 0) p.atk--;
  if (keys.atkHit && p.atkCd === 0) { p.atk = 14; p.atkCd = 22; AU.slash(); }
  // physics
  p.vy = Math.min(p.vy + 0.55, 13);
  moveX(p, p.vx);
  const wasAir = !p.onGround;
  p.onGround = moveY(p, p.vy) === 'floor';
  if (p.onGround && wasAir && p.vy >= 0) burst(p.x + 10, p.y + p.h, '#c9b79a', 4, 3);
  if (p.inv > 0) p.inv--;
  p.animT += Math.abs(p.vx) * 0.06 + 0.02;
  // spikes
  const c0 = Math.floor(p.x / TS), c1 = Math.floor((p.x + p.w - 1) / TS);
  const rB = Math.floor((p.y + p.h - 4) / TS);
  for (let tx = c0; tx <= c1; tx++) if (tileAt(tx, rB) === '^' && p.y + p.h > rB * TS + 14) hurtPlayer(p.x);
  // pit
  if (p.y > LH * TS + 80) { p.hp = 0; killPlayer(); }
  // checkpoints
  for (const c of checkpoints) if (!c.on && Math.abs(p.x - c.x) < 24 && Math.abs(p.y + p.h - (c.y + TS)) < 40) {
    c.on = true; checkpoint = {x: c.x, y: c.y - 6}; AU.checkpoint();
    popup(c.x + 8, c.y - 10, 'CHECKPOINT!', '#8ae2ff');
  }
  // goal
  if (state === 'play' && Math.abs(p.x + p.w / 2 - (goal.x + TS / 2)) < 26 && Math.abs(p.y + p.h - (goal.y + TS * 2)) < 70) {
    state = 'win'; winTimer = 0; AU.win();
    addScore(500 + lives * 250);
    if (score > best) { best = score; try { localStorage.setItem('ember_best', best); } catch (e) {} }
  }
}
function swordBox(){
  const p = player;
  if (p.atk < 3 || p.atk > 12) return null;
  return {x: p.dir > 0 ? p.x + p.w - 4 : p.x - 28, y: p.y + 6, w: 32, h: 22};
}
function updateEnemies(){
  const p = player, sb = swordBox();
  for (const e of enemies) {
    if (e.dead) continue;
    e.t = (e.t || 0) + 1;
    if (e.kind === 'b') {
      e.x = e.ax + Math.sin(e.t * 0.021) * 58;
      e.y = e.ay + Math.sin(e.t * 0.06) * 24;
      e.dir = Math.cos(e.t * 0.021) > 0 ? 1 : -1;
    } else {
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      if (moveX(e, e.vx) || (onG && !groundAhead(e))) { e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
    }
    if (p.dead) continue;
    // sword hit
    if (sb && overlap(sb, e)) {
      e.dead = true;
      const pts = e.kind === 's' ? 50 : e.kind === 'b' ? 75 : 100;
      addScore(pts, e.x + e.w / 2, e.y);
      burst(e.x + e.w / 2, e.y + e.h / 2, e.kind === 's' ? '#7ed957' : e.kind === 'b' ? '#8a5cd6' : '#e8e4da', 12);
      AU.stomp(); continue;
    }
    // touch
    if (overlap(p, e)) {
      if (p.vy > 1 && p.y + p.h - e.y < 16) { // stomp
        e.dead = true; p.vy = -8.5;
        const pts = e.kind === 's' ? 50 : e.kind === 'b' ? 75 : 100;
        addScore(pts, e.x + e.w / 2, e.y);
        burst(e.x + e.w / 2, e.y + e.h / 2, e.kind === 's' ? '#7ed957' : e.kind === 'b' ? '#8a5cd6' : '#e8e4da', 12);
        AU.stomp();
      } else hurtPlayer(e.x + e.w / 2);
    }
  }
}
function updateItems(){
  const p = player;
  for (const it of items) {
    if (it.taken) continue;
    it.t += 0.1;
    const box = {x: it.x + 6, y: it.y + 4 + Math.sin(it.t) * 3, w: 20, h: 22};
    if (!p.dead && overlap(p, box)) {
      it.taken = true;
      if (it.kind === 'c') { coins++; addScore(10); AU.coin(); burst(it.x + 16, it.y + 14, '#ffd75e', 6, 2.5); }
      else if (it.kind === 'g') { addScore(100, it.x + 10, it.y); AU.gem(); burst(it.x + 16, it.y + 14, '#5ee0e8', 10); }
      else if (it.kind === 'h') {
        if (p.hp < 3) { p.hp++; popup(it.x, it.y, '+1 HP', '#ff9db0'); }
        else addScore(50, it.x + 6, it.y);
        AU.pickup(); burst(it.x + 16, it.y + 14, '#e84a5f', 8);
      }
    }
  }
}
function updateFx(){
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.grav; q.life--;
    if (q.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i]; q.y -= 0.7; q.life--;
    if (q.life <= 0) popups.splice(i, 1);
  }
}
function updateCamera(){
  const tx = Math.max(0, Math.min(player.x - VW * 0.38, LW * TS - VW));
  cam.x += (tx - cam.x) * 0.12;
  if (cam.shake > 0) cam.shake--;
}

//----------------------------------------------------------------------
// DRAWING
//----------------------------------------------------------------------
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#1a1033'); g.addColorStop(0.45, '#4d2a5e');
  g.addColorStop(0.75, '#c2566b'); g.addColorStop(1, '#f0a05a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // stars
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 40; i++) {
    const sx = (hash(i, 7) * VW * 2 - cam.x * 0.05) % VW, sy = hash(i, 13) * VH * 0.4;
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(frame * 0.03 + i));
    ctx.globalAlpha = tw * 0.8;
    ctx.fillRect((sx + VW) % VW, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
  // low sun
  ctx.fillStyle = '#ffdca8';
  ctx.beginPath(); ctx.arc(VW * 0.72, VH * 0.78, 46, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,168,.25)';
  ctx.beginPath(); ctx.arc(VW * 0.72, VH * 0.78, 70, 0, 7); ctx.fill();
}
function ridge(par, base, amp1, f1, amp2, f2, color, castle){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, VH);
  for (let sx = 0; sx <= VW; sx += 8) {
    const wx = sx + cam.x * par;
    const y = base - Math.abs(Math.sin(wx * f1)) * amp1 - Math.abs(Math.sin(wx * f2 + 2)) * amp2;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(VW, VH); ctx.fill();
  if (castle) { // distant castle silhouette, fixed in world at ~35%
    const cx = 2600 * (1) - cam.x * par; // world-ish anchor
    const sx = ((cx % (VW * 1.6)) + VW * 1.6) % (VW * 1.6) - 100;
    if (sx > -120 && sx < VW + 40) {
      const by = base - 58;
      ctx.fillRect(sx, by - 60, 16, 60); ctx.fillRect(sx + 40, by - 78, 18, 78);
      ctx.fillRect(sx + 12, by - 40, 32, 40);
      for (let i = 0; i < 4; i++) ctx.fillRect(sx + i * 5, by - 66, 3, 6);
      for (let i = 0; i < 4; i++) ctx.fillRect(sx + 40 + i * 5, by - 84, 3, 6);
    }
  }
}
function drawParallax(){
  ridge(0.15, VH * 0.82, 90, 0.0021, 55, 0.0056, '#35204f', true);
  ridge(0.35, VH * 0.9, 55, 0.004, 30, 0.009, '#26244a');
  ridge(0.6, VH * 0.99, 40, 0.008, 22, 0.017, '#1c2140');
  // drifting clouds
  ctx.fillStyle = 'rgba(214,140,170,.28)';
  for (let i = 0; i < 6; i++) {
    const cx = ((hash(i, 3) * 2200 + frame * (0.12 + i * 0.03) - cam.x * 0.25) % (VW + 300)) - 150;
    const cy = 40 + hash(i, 9) * 150;
    ctx.beginPath();
    ctx.ellipse((cx + VW + 300) % (VW + 300) - 150, cy, 60 + i * 8, 14, 0, 0, 7);
    ctx.fill();
  }
}
function drawTiles(){
  const x0 = Math.max(0, Math.floor(cam.x / TS)), x1 = Math.min(LW - 1, Math.ceil((cam.x + VW) / TS));
  for (let ty = 0; ty < LH; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = grid[ty][tx], sx = tx * TS - cam.x, sy = ty * TS;
    if (t === '#') {
      const grass = tileAt(tx, ty - 1) !== '#';
      ctx.fillStyle = '#54402e'; ctx.fillRect(sx, sy, TS, TS);
      ctx.fillStyle = '#463527';
      for (let i = 0; i < 4; i++) {
        const rx = hash(tx * 4 + i, ty) * 26, ry = hash(tx, ty * 4 + i) * 26;
        ctx.fillRect(sx + 3 + rx, sy + 3 + ry, 3, 3);
      }
      if (grass) {
        ctx.fillStyle = '#4f8f3f'; ctx.fillRect(sx, sy, TS, 8);
        ctx.fillStyle = '#6fb44f';
        ctx.fillRect(sx + (hash(tx, 1) * 20 | 0), sy - 4, 3, 4);
        ctx.fillRect(sx + 20 + (hash(tx, 2) * 8 | 0), sy - 3, 3, 3);
        ctx.fillRect(sx, sy, TS, 3);
      }
      if (tileAt(tx - 1, ty) !== '#') { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(sx, sy, 3, TS); }
      if (tileAt(tx + 1, ty) !== '#') { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(sx + TS - 3, sy, 3, TS); }
    } else if (t === '=') {
      ctx.fillStyle = '#8a5a33'; ctx.fillRect(sx, sy, TS, 12);
      ctx.fillStyle = '#a06c3e'; ctx.fillRect(sx, sy, TS, 4);
      ctx.fillStyle = '#5e3c20'; ctx.fillRect(sx + 2, sy + 8, 3, 3); ctx.fillRect(sx + TS - 6, sy + 8, 3, 3);
    } else if (t === '^') {
      ctx.fillStyle = '#3b3b46'; ctx.fillRect(sx, sy + 26, TS, 6);
      ctx.fillStyle = '#aab4c0';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + i * 8, sy + 27); ctx.lineTo(sx + i * 8 + 4, sy + 8); ctx.lineTo(sx + i * 8 + 8, sy + 27);
        ctx.fill();
      }
    }
  }
}
function drawCastle(){
  const gx = goal.x - cam.x, gy = goal.y;
  if (gx < -260 || gx > VW + 100) return;
  const x = gx - 64, topY = gy - 128;
  ctx.fillStyle = '#6f7689';                        // main keep
  ctx.fillRect(x, topY, 160, 192);
  ctx.fillStyle = '#7d8496';
  ctx.fillRect(x - 26, topY - 40, 34, 232); ctx.fillRect(x + 152, topY - 40, 34, 232);
  ctx.fillStyle = '#5c6375';                        // stones
  for (let i = 0; i < 24; i++)
    ctx.fillRect(x + 8 + (i % 6) * 25 + (i / 6 | 0) % 2 * 10, topY + 14 + (i / 6 | 0) * 30, 14, 8);
  ctx.fillStyle = '#7d8496';                        // crenellations
  for (let i = 0; i < 5; i++) ctx.fillRect(x + i * 34, topY - 16, 20, 16);
  for (let i = 0; i < 2; i++) { ctx.fillRect(x - 26 + i * 178, topY - 56, 10, 16); ctx.fillRect(x - 8 + i * 178, topY - 56, 10, 16); }
  ctx.fillStyle = '#241f2e';                        // door
  ctx.beginPath(); ctx.arc(gx + 16, gy + 26, 26, Math.PI, 0); ctx.fill();
  ctx.fillRect(gx - 10, gy + 26, 52, 38);
  ctx.fillStyle = '#3a3348';
  ctx.fillRect(gx + 13, gy + 10, 3, 54);
  // banner + waving flag
  ctx.fillStyle = '#8a2635'; ctx.fillRect(x + 66, topY + 30, 28, 44);
  ctx.fillStyle = '#e8b23a'; ctx.fillRect(x + 76, topY + 44, 8, 8);
  ctx.fillStyle = '#c9b79a'; ctx.fillRect(x + 78, topY - 60, 4, 46);
  ctx.fillStyle = '#d43d3d';
  ctx.beginPath();
  const w = Math.sin(frame * 0.1) * 4;
  ctx.moveTo(x + 82, topY - 60); ctx.lineTo(x + 116 + w, topY - 52); ctx.lineTo(x + 82, topY - 42);
  ctx.fill();
}
function drawCheckpoints(){
  for (const c of checkpoints) {
    const sx = c.x - cam.x + 10;
    if (sx < -40 || sx > VW + 40) continue;
    ctx.fillStyle = '#c9b79a'; ctx.fillRect(sx, c.y - 26, 4, 58);
    ctx.fillStyle = c.on ? '#d43d3d' : '#6e7b8f';
    const fw = c.on ? Math.sin(frame * 0.12) * 3 : 0;
    ctx.beginPath();
    ctx.moveTo(sx + 4, c.y - 26); ctx.lineTo(sx + 26 + fw, c.y - 19); ctx.lineTo(sx + 4, c.y - 12);
    ctx.fill();
  }
}
function drawItems(){
  for (const it of items) {
    if (it.taken) continue;
    const sx = it.x - cam.x + 16, sy = it.y + 16 + Math.sin(it.t) * 3;
    if (sx < -40 || sx > VW + 40) continue;
    if (it.kind === 'c') {
      const sq = Math.abs(Math.cos(it.t * 1.4));
      ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.ellipse(sx, sy, 8 * Math.max(sq, 0.18), 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd75e'; ctx.beginPath(); ctx.ellipse(sx, sy, 6.5 * Math.max(sq, 0.15), 7.5, 0, 0, 7); ctx.fill();
      if (sq > 0.5) { ctx.fillStyle = '#fff3c4'; ctx.fillRect(sx - 2, sy - 4, 2, 4); }
    } else if (it.kind === 'g') {
      ctx.fillStyle = '#2f8f96';
      ctx.beginPath(); ctx.moveTo(sx, sy - 11); ctx.lineTo(sx + 9, sy); ctx.lineTo(sx, sy + 11); ctx.lineTo(sx - 9, sy); ctx.fill();
      ctx.fillStyle = '#5ee0e8';
      ctx.beginPath(); ctx.moveTo(sx, sy - 8); ctx.lineTo(sx + 6, sy); ctx.lineTo(sx, sy + 8); ctx.lineTo(sx - 6, sy); ctx.fill();
      ctx.fillStyle = '#c8f7fa'; ctx.fillRect(sx - 2, sy - 5, 2, 3);
    } else {
      ctx.drawImage(SPR.heart, sx - 8, sy - 6);
    }
  }
}
function drawSprite(img, x, y, flip){
  ctx.save();
  if (flip) { ctx.translate(x + img.width, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); }
  else ctx.drawImage(img, x, y);
  ctx.restore();
}
function drawEnemies(){
  for (const e of enemies) {
    if (e.dead) continue;
    const sx = e.x - cam.x;
    if (sx < -60 || sx > VW + 60) continue;
    if (e.kind === 's') {
      const squash = 1 + Math.sin(e.t * 0.15) * 0.08;
      ctx.save();
      ctx.translate(sx + e.w / 2, e.y + e.h);
      ctx.scale(2 - squash, squash);
      ctx.drawImage(SPR.slime, -14, -16);
      ctx.restore();
    } else if (e.kind === 'b') {
      drawSprite((e.t / 8 | 0) % 2 ? SPR.bat1 : SPR.bat2, sx - 1, e.y - 2, e.dir < 0);
    } else {
      drawSprite((e.t / 9 | 0) % 2 ? SPR.skel1 : SPR.skel2, sx - 1, e.y - 1, e.dir < 0);
    }
  }
}
function drawPlayer(){
  const p = player;
  if (p.inv > 0 && (p.inv / 4 | 0) % 2) return; // damage flicker
  let img = SPR.heroIdle;
  if (!p.onGround) img = SPR.heroJump;
  else if (Math.abs(p.vx) > 0.4) img = (p.animT / 0.6 | 0) % 2 ? SPR.heroRun1 : SPR.heroRun2;
  const sx = p.x - cam.x - 4, sy = p.y - 2 + (p.dead ? 0 : 0);
  if (p.dead) {
    ctx.save();
    ctx.translate(sx + 14, sy + 18); ctx.rotate(deadTimer * 0.15);
    ctx.drawImage(img, -14, -18);
    ctx.restore();
    return;
  }
  drawSprite(img, sx, sy, p.dir < 0);
  if (p.atk > 0) {
    const prog = 1 - p.atk / 14;
    const reach = Math.sin(prog * Math.PI) * 10 + 14;
    const swy = p.y + 10 - Math.sin(prog * Math.PI) * 4;
    drawSprite(SPR.sword, p.dir > 0 ? p.x - cam.x + reach + 4 : p.x - cam.x - reach - 24, swy, p.dir < 0);
  }
}
function drawFx(){
  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.life / 15);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - cam.x, q.y, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const q of popups) {
    ctx.globalAlpha = Math.min(1, q.life / 20);
    text(q.txt, q.x - cam.x, q.y, 14, q.color);
  }
  ctx.globalAlpha = 1;
}
function text(str, x, y, size, color, align){
  ctx.textAlign = align || 'center';
  ctx.font = 'bold ' + size + "px 'Courier New',monospace";
  ctx.fillStyle = 'rgba(20,12,32,.9)';
  ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function drawHUD(){
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = i < player.hp ? 1 : 0.25;
    ctx.drawImage(SPR.heart, 16 + i * 24, 14, 20, 15);
  }
  ctx.globalAlpha = 1;
  // coin counter
  ctx.fillStyle = '#ffd75e'; ctx.beginPath(); ctx.ellipse(26, 52, 7, 8, 0, 0, 7); ctx.fill();
  text('x ' + coins, 40, 58, 16, '#ffe9ad', 'left');
  text('LIVES ' + lives, 16, 82, 16, '#c8d4e8', 'left');
  text('SCORE ' + score, VW - 16, 30, 18, '#ffe9ad', 'right');
  const secs = playTime / 60 | 0;
  text((secs / 60 | 0) + ':' + ('0' + secs % 60).slice(-2), VW - 16, 54, 16, '#c8d4e8', 'right');
}
function scanlines(){
  ctx.fillStyle = 'rgba(0,0,0,.07)';
  for (let y = 0; y < VH; y += 4) ctx.fillRect(0, y, VW, 2);
}
function drawWorld(){
  ctx.save();
  if (cam.shake > 0) ctx.translate((Math.random() - 0.5) * cam.shake, (Math.random() - 0.5) * cam.shake);
  drawSky(); drawParallax(); drawCastle(); drawTiles(); drawCheckpoints();
  drawItems(); drawEnemies(); drawPlayer(); drawFx();
  ctx.restore();
}

function titleScreen(){
  drawSky(); drawParallax();
  cam.x = (cam.x + 0.4) % (LW * TS - VW);
  drawTiles(); drawCastle(); scanlines();
  ctx.fillStyle = 'rgba(13,8,25,.45)'; ctx.fillRect(0, 0, VW, VH);
  const bob = Math.sin(frame * 0.05) * 6;
  text('EMBERWOOD', VW / 2, 170 + bob, 78, '#ffb347');
  text('QUEST', VW / 2, 244 + bob, 78, '#ffd75e');
  text('~ a tale of the fallen kingdom ~', VW / 2, 288 + bob, 18, '#c8a0d8');
  drawSprite(SPR.heroIdle, VW / 2 - 14, 330 + Math.sin(frame * 0.08) * 4, false);
  if ((frame / 30 | 0) % 2) text('PRESS ENTER TO BEGIN', VW / 2, 430, 24, '#ffffff');
  text('ARROWS / WASD move    Z / SPACE jump    X / J sword', VW / 2, 480, 15, '#9aa5c8');
  text('M music    P pause' + (best ? '    BEST ' + best : ''), VW / 2, 505, 15, '#9aa5c8');
}
function winScreen(){
  drawWorld(); scanlines();
  winTimer++;
  ctx.fillStyle = 'rgba(13,8,25,' + Math.min(0.6, winTimer / 60) + ')';
  ctx.fillRect(0, 0, VW, VH);
  if (winTimer > 30) {
    text('QUEST COMPLETE!', VW / 2, 200, 54, '#ffd75e');
    text('The kingdom of Emberwood is saved.', VW / 2, 250, 18, '#c8a0d8');
    const secs = playTime / 60 | 0;
    text('SCORE  ' + score, VW / 2, 310, 26, '#ffffff');
    text('COINS  ' + coins + '      TIME  ' + (secs / 60 | 0) + ':' + ('0' + secs % 60).slice(-2), VW / 2, 345, 18, '#c8d4e8');
    if (score >= best) text('* NEW BEST *', VW / 2, 385, 18, '#8ae2ff');
    if ((frame / 30 | 0) % 2) text('PRESS ENTER TO PLAY AGAIN', VW / 2, 440, 20, '#ffffff');
  }
}
function gameoverScreen(){
  drawWorld(); scanlines();
  ctx.fillStyle = 'rgba(13,8,25,.65)'; ctx.fillRect(0, 0, VW, VH);
  text('GAME OVER', VW / 2, 230, 64, '#d43d3d');
  text('The realm falls into shadow...', VW / 2, 280, 18, '#9aa5c8');
  text('SCORE  ' + score + (best ? '      BEST  ' + best : ''), VW / 2, 330, 22, '#ffffff');
  if ((frame / 30 | 0) % 2) text('PRESS ENTER TO TRY AGAIN', VW / 2, 400, 20, '#ffffff');
}

//----------------------------------------------------------------------
// MAIN LOOP (fixed 60hz step)
//----------------------------------------------------------------------
resetLevel(false);
state = 'title';
let acc = 0, last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60) { acc -= 1000 / 60; step(); }
}
function step(){
  frame++;
  if (state === 'title') {
    titleScreen();
    if (keys.startHit || keys.jumpHit) { resetLevel(false); state = 'play'; }
  } else if (state === 'play') {
    if (keys.pauseHit) paused = !paused;
    if (!paused) {
      playTime++;
      updatePlayer(); updateEnemies(); updateItems(); updateFx(); updateCamera();
    }
    drawWorld(); drawHUD(); scanlines();
    if (paused) {
      ctx.fillStyle = 'rgba(13,8,25,.55)'; ctx.fillRect(0, 0, VW, VH);
      text('PAUSED', VW / 2, VH / 2, 48, '#ffffff');
    }
  } else if (state === 'win') {
    winScreen();
    if (winTimer > 60 && keys.startHit) { state = 'title'; }
  } else if (state === 'gameover') {
    gameoverScreen();
    if (keys.startHit) { state = 'title'; }
  }
  keys.jumpHit = keys.atkHit = keys.startHit = keys.pauseHit = false;
}
requestAnimationFrame(tick);
</script>
<!-- GAME END -->
