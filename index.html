<div id="wrap"><canvas id="game" width="960" height="544"></canvas></div>

<script>
'use strict';
//======================================================================
//  EMBERWARD -- A Tale of Caldermark
//  Act I: The Ash Harvest
//  "The fire that warms and the fire that eats are the same fire."
//======================================================================
const TS = 32, VW = 960, VH = 544;
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fitCanvas(){
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  cvs.style.width  = Math.floor(VW * s) + 'px';
  cvs.style.height = Math.floor(VH * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };
const FONT = "'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif";

//======================================================================
// SPRITES -- procedural pixel painter (paint shaded regions, auto-outline)
//======================================================================
function newGrid(w, h){ return Array.from({length: h}, () => Array(w).fill('.')); }
function rect(G, x0, y0, x1, y1, c){ for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (G[y] && G[y][x] !== undefined) G[y][x] = c; }
function seg(G, x0, y0, x1, y1, c, th){
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++){
    const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    rect(G, x, y, x + th - 1, y + th - 1, c);
  }
}
function outline(G){
  const h = G.length, w = G[0].length, out = G.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (G[y][x] !== '.') continue;
    const n = [[0,1],[0,-1],[1,0],[-1,0]].some(([dx, dy]) => {
      const row = G[y + dy]; const c = row && row[x + dx]; return c && c !== '.' && c !== 'O'; });
    if (n) out[y][x] = 'O';
  }
  return out;
}
function texture(G){
  const h = G.length, w = G[0].length;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const c = G[y][x];
    if (c === '2' && hash(x, y) > 0.84) G[y][x] = '3';
    else if (c === '3' && hash(x + 9, y) < 0.10) G[y][x] = '2';
    else if (c === 'R' && hash(x * 3, y) > 0.86) G[y][x] = 'r';
    else if (c === 'L' && hash(x, y * 3) > 0.86) G[y][x] = 'M';
  }
}
function px(pal, rows, scale){
  const c = document.createElement('canvas');
  c.width = rows[0].length * scale; c.height = rows.length * scale;
  const g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++){
    const col = pal[rows[y][x]];
    if (col){ g.fillStyle = col; g.fillRect(x * scale, y * scale, scale, scale); }
  }
  return c;
}
function tinted(img, color){ // white/black silhouette for flashes
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// -- ember warpath palette --
const PAL = {W:'#e8dcc2', w:'#a08a5c', O:'#160d08', '1':'#2e2417', '2':'#5a4526', '3':'#8a6d3a', '4':'#c2a05c',
  r:'#4a1a12', R:'#7a2e1c', Q:'#a04428', l:'#2a1c10', L:'#443019', M:'#5f4526',
  g:'#c2762e', G:'#c2762e', X:'#c96a2e', s:'#7a5a44', S:'#a67c5c'};
const BONE = {O:'#160d08', '4':'#c9b89a', '3':'#a89878', '2':'#5a4526', M:'#5f4526', L:'#443019', X:'#ffb347', W:'#e8dcc2', w:'#a08a5c', G:'#c2762e'};
// stage palettes: the visor/glow char X brightens; ember cracks use 'E'
const STAGE_PAL = [
  {...PAL, X:'#b05a24', E:'#b05a24'},                    // unawakened: dim flicker
  {...PAL, X:'#e88a34', E:'#e88a34'},                    // SPARK: steady
  {...PAL, X:'#ffb347', E:'#ff9a3c'},                    // KINDLED
  {...PAL, X:'#ffd75e', E:'#ffb347'},                    // ABLAZE
];

//----------------------------------------------------------------------
// THE HEARTHLESS KNIGHT -- 38x36, Rastan stance, closed helm.
// stage 0..3 = unawakened / Spark / Kindled / Ablaze (visible transformation)
//----------------------------------------------------------------------
function buildHero(pose, stage){
  const G = newGrid(38, 36);
  const lunge = pose === 'slash' ? 1 : 0;
  // tattered cape
  for (let y = 12; y <= 29; y++){
    const w = 2 + Math.round((y - 12) * 0.45), x1 = 9 - Math.round((y - 12) * 0.25), x0 = Math.max(1, x1 - w);
    rect(G, x0, y, x1, y, 'R'); G[y][x0] = 'Q';
  }
  [[2,29],[4,28],[1,27],[3,26],[5,29],[2,24]].forEach(([x, y]) => { if (G[y]) G[y][x] = '.'; });
  if (stage >= 2){ // KINDLED: cape hem chars and glows
    for (let y = 26; y <= 29; y++) for (let x = 1; x <= 8; x++) if (G[y][x] === 'R' || G[y][x] === 'Q') G[y][x] = (hash(x, y) > 0.5 ? 'E' : 'r');
  }
  // legs
  if (pose === 'run1'){
    seg(G, 12, 21, 7, 25, '1', 3);  seg(G, 7, 25, 5, 30, '2', 3);   rect(G, 3, 31, 8, 33, 'l');
    seg(G, 14, 21, 19, 25, '2', 3); seg(G, 19, 25, 20, 30, '3', 3); rect(G, 18, 31, 24, 33, 'M');
    rect(G, 18, 31, 24, 31, 'L');
  } else if (pose === 'run2'){
    seg(G, 12, 21, 15, 26, '1', 3); seg(G, 15, 26, 16, 31, '2', 3); rect(G, 14, 32, 19, 34, 'l');
    seg(G, 14, 21, 10, 25, '2', 3); seg(G, 10, 25, 9, 30, '3', 3);  rect(G, 7, 31, 13, 33, 'M');
  } else if (pose === 'jump'){
    seg(G, 12, 21, 9, 24, '1', 3);  seg(G, 9, 24, 10, 27, '2', 3);  rect(G, 8, 28, 13, 30, 'l');
    seg(G, 14, 21, 17, 25, '2', 3); seg(G, 17, 25, 16, 29, '3', 3); rect(G, 14, 30, 20, 32, 'M');
  } else {
    seg(G, 12, 21, 9 + (-lunge), 26, '1', 3); seg(G, 9 - lunge, 26, 8 - lunge, 31, '2', 3); rect(G, 5 - lunge, 32, 11 - lunge, 34, 'l');
    seg(G, 14, 21, 17 + lunge * 2, 26, '2', 3); seg(G, 17 + lunge * 2, 26, 17 + lunge * 2, 31, '3', 3);
    rect(G, 15 + lunge * 2, 32, 21 + lunge * 2, 34, 'M'); rect(G, 15 + lunge * 2, 32, 21 + lunge * 2, 32, 'L');
  }
  // hips + belt
  rect(G, 10, 19, 17, 22, '2'); rect(G, 10, 21, 17, 22, 'L');
  G[21][11] = 'G'; G[21][14] = 'G'; G[21][17] = 'G';
  // torso, forward lean
  for (let y = 12; y <= 19; y++){
    const off = Math.round((19 - y) * 0.4) + lunge;
    rect(G, 10 + off, y, 17 + off, y, '2');
    G[y][17 + off] = '3'; G[y][10 + off] = '1';
  }
  const co = 3 + lunge;
  G[14][12 + co] = 'g'; G[18][11 + lunge] = 'g';
  if (stage >= 2){ G[16][12 + lunge] = 'E'; G[19][12] = 'E'; }               // joint-seam cracks
  if (stage >= 3){ G[15][13 + lunge] = 'E'; G[17][14 + lunge] = 'E'; G[13][14 + co] = 'E'; } // chest cracks
  // fur mantle
  for (let y = 10; y <= 12; y++) for (let x = 9 + co; x <= 19 + co; x++)
    G[y][x] = hash(x, y) > 0.6 ? 'M' : (hash(x + 5, y) > 0.5 ? 'L' : 'l');
  // CLOSED war-helm
  const hx = 13 + co;
  rect(G, hx, 2, hx + 7, 9, '3'); rect(G, hx + 1, 1, hx + 6, 1, '4');
  rect(G, hx, 2, hx, 9, '2');
  rect(G, hx + 7, 3, hx + 7, 8, '4');
  rect(G, hx + 3, 5, hx + 7, 5, '1');
  G[5][hx + 4] = 'X'; G[5][hx + 6] = 'X';
  rect(G, hx + 2, 7, hx + 5, 7, '2'); G[7][hx + 3] = '1'; G[7][hx + 5] = '1';
  rect(G, hx + 2, 9, hx + 5, 10, '2');
  // crest (Ablaze: it burns)
  seg(G, hx + 1, 1, hx - 4, 5, stage >= 3 ? 'E' : 'R', 2);
  G[5][hx - 4] = stage >= 3 ? 'X' : 'Q'; G[2][hx - 1] = stage >= 3 ? 'X' : 'Q';
  // off arm
  rect(G, 9 + co, 12, 12 + co, 14, '3'); rect(G, 9 + co, 14, 12 + co, 15, '2');
  seg(G, 11 + co, 15, 13, 18, '2', 2); rect(G, 13, 17, 14, 18, 'M');
  // lantern on the belt, always dark (the twist rides here)
  rect(G, 13, 19, 15, 21, '1'); G[19][14] = 'l';
  // lead arm + Brand
  rect(G, 15 + co, 12, 19 + co, 14, '4'); rect(G, 15 + co, 14, 19 + co, 15, '3');
  if (pose === 'slash' || pose === 'cast'){
    seg(G, 18 + co, 14, 24, 15, '3', 2);
    rect(G, 25, 13, 26, 15, 'M');
    rect(G, 27, 12, 27, 16, 'G');
    rect(G, 28, 13, 36, 13, 'W'); rect(G, 28, 14, 36, 14, 'w'); G[13][37] = 'W';
    if (stage >= 1) rect(G, 28, 12, 35, 12, 'E');            // hot edge-line
    G[15][24] = 'G';
  } else {
    seg(G, 18 + co, 14, 21, 16, '3', 2);
    G[18][21] = 'G';
    seg(G, 22, 17, 23, 16, 'M', 1);
    rect(G, 22, 15, 23, 16, 'M');
    G[14][23] = 'G'; G[15][24] = 'G'; G[16][25] = 'G'; G[16][23] = 'G'; G[14][25] = 'G';
    for (let i = 0; i < 10; i++){
      const bx = 25 + i, by = 13 - i;
      if (bx < 38 && by >= 0){ G[by][bx] = 'W'; if (by + 1 < 36) G[by + 1][bx] = 'w'; }
    }
    if (stage >= 1) for (let i = 0; i < 8; i++){ const bx = 25 + i, by = 12 - i; if (bx < 38 && by >= 0 && G[by][bx] === '.') G[by][bx] = 'E'; }
  }
  texture(G);
  return outline(G).map(r => r.join(''));
}
//----------------------------------------------------------------------
// ENEMIES
//----------------------------------------------------------------------
function buildHound(frame){ // frame 0/1 run, 2 windup
  const G = newGrid(26, 16);
  const crouch = frame === 2 ? 2 : 0;
  seg(G, 3, 5 + crouch, 16, 4 + crouch, 'L', 4);
  rect(G, 15, 2 + crouch, 20, 6 + crouch, 'L'); rect(G, 19, 4 + crouch, 24, 6 + crouch, 'l');
  G[3 + crouch][21] = 'X';
  rect(G, 16, 1 + crouch, 17, 2 + crouch, 'l');
  seg(G, 3, 5 + crouch, 0, 1 + crouch, 'l', 2);
  rect(G, 3, 3 + crouch, 15, 3 + crouch, 'l');
  if (frame === 1){
    seg(G, 5, 9, 8, 13, 'l', 2); seg(G, 10, 9, 8, 13, 'L', 2);
    seg(G, 14, 9, 16, 13, 'l', 2); seg(G, 17, 8, 14, 13, 'L', 2);
  } else {
    seg(G, 5, 9 + crouch, 4, 13, 'l', 2); seg(G, 9, 9 + crouch, 9, 13, 'L', 2);
    seg(G, 13, 9 + crouch, 12, 13, 'l', 2); seg(G, 16, 8 + crouch, 17, 13, 'L', 2);
  }
  texture(G); return outline(G).map(r => r.join(''));
}
function buildLevy(frame){ // bone levy, 1-hit fodder
  const G = newGrid(28, 30);
  rect(G, 8, 1, 13, 6, '4'); G[3][9] = 'O'; G[3][12] = 'O'; rect(G, 6, 0, 13, 1, '2');
  rect(G, 9, 6, 12, 7, '3'); G[7][10] = 'O';
  rect(G, 10, 8, 11, 9, '4');
  rect(G, 6, 10, 15, 11, 'L'); rect(G, 5, 10, 8, 13, 'M');
  for (let y = 12; y <= 17; y++){ rect(G, 8, y, 13, y, y % 2 ? '4' : '3'); }
  rect(G, 10, 12, 11, 17, '4');
  rect(G, 9, 18, 12, 20, 'L'); G[19][10] = 'G';
  if (frame){
    seg(G, 9, 21, 12, 25, '4', 2); seg(G, 12, 26, 13, 28, '3', 2); rect(G, 11, 28, 15, 29, 'L');
    seg(G, 12, 21, 8, 25, '4', 2); seg(G, 8, 26, 7, 28, '3', 2); rect(G, 5, 28, 9, 29, 'L');
  } else {
    seg(G, 9, 21, 8, 25, '4', 2); seg(G, 8, 26, 7, 28, '3', 2); rect(G, 5, 28, 9, 29, 'L');
    seg(G, 12, 21, 13, 25, '4', 2); seg(G, 13, 26, 14, 28, '3', 2); rect(G, 12, 28, 16, 29, 'L');
  }
  seg(G, 14, 12, 18, 15, '4', 2);
  rect(G, 18, 15, 19, 16, 'L');
  rect(G, 20, 13, 20, 17, 'G');
  for (let i = 0; i < 7; i++){ const bx = 21 + i, by = 14 - i; if (bx < 28 && by >= 0){ G[by][bx] = 'W'; if (i % 3 !== 2 && by + 1 < 30) G[by + 1][bx] = 'w'; } }
  seg(G, 7, 12, 4, 16, '4', 2); rect(G, 3, 15, 4, 17, 'L');
  return outline(G).map(r => r.join(''));
}
function buildBrigand(pose){ // 3-hit heavy: walk1/walk2/raise/swing
  const G = newGrid(34, 32);
  rect(G, 10, 1, 17, 7, '2'); rect(G, 11, 0, 16, 0, '3');
  rect(G, 13, 4, 17, 4, '1');
  seg(G, 10, 2, 7, 0, 'G', 2); seg(G, 17, 2, 20, 0, 'G', 2);
  for (let y = 8; y <= 10; y++) for (let x = 7; x <= 20; x++) G[y][x] = hash(x, y) > 0.55 ? 'M' : 'l';
  rect(G, 8, 11, 19, 19, 'L'); rect(G, 8, 11, 8, 19, 'l'); rect(G, 18, 11, 19, 19, 'M');
  seg(G, 8, 11, 19, 18, 'R', 2);
  rect(G, 8, 19, 19, 21, 'l'); G[20][11] = 'G'; G[20][15] = 'G';
  if (pose === 'walk2'){
    seg(G, 11, 22, 13, 26, 'l', 3); seg(G, 13, 27, 14, 30, 'L', 3); rect(G, 12, 30, 18, 31, 'l');
    seg(G, 15, 22, 11, 26, 'L', 3); seg(G, 11, 27, 10, 30, 'M', 3); rect(G, 8, 30, 14, 31, 'l');
  } else {
    seg(G, 11, 22, 9, 26, 'l', 3); seg(G, 9, 27, 8, 30, 'L', 3); rect(G, 6, 30, 12, 31, 'l');
    seg(G, 15, 22, 17, 26, 'L', 3); seg(G, 17, 27, 17, 30, 'M', 3); rect(G, 15, 30, 21, 31, 'l');
  }
  if (pose === 'raise'){        // axe overhead -- the telegraph
    seg(G, 17, 12, 21, 6, 'M', 2); rect(G, 20, 4, 22, 6, 'M');
    seg(G, 22, 5, 23, -2, 'l', 2);
    rect(G, 19, 0, 27, 4, '2'); rect(G, 26, 0, 27, 4, '3'); rect(G, 28, 0, 28, 3, 'W');
  } else if (pose === 'swing'){ // axe slammed down in front
    seg(G, 17, 13, 24, 16, 'M', 2); rect(G, 24, 15, 26, 17, 'M');
    seg(G, 26, 16, 29, 22, 'l', 2);
    rect(G, 26, 22, 33, 27, '2'); rect(G, 26, 26, 33, 27, '3'); rect(G, 26, 28, 33, 28, 'W');
  } else {                      // shouldered
    seg(G, 22, 3, 18, 20, 'l', 2);
    rect(G, 21, 1, 27, 6, '2'); rect(G, 26, 1, 27, 6, '3');
    rect(G, 28, 2, 28, 5, 'W');
    seg(G, 16, 13, 20, 17, 'M', 2); rect(G, 19, 17, 21, 19, 'M');
  }
  seg(G, 9, 12, 6, 16, '2', 2); rect(G, 5, 15, 6, 17, 'M');
  texture(G); return outline(G).map(r => r.join(''));
}
function buildWraith(frame){ // background tease in Act I
  const G = newGrid(24, 14);
  const up = frame ? -1 : 1;
  for (let x = 1; x <= 8; x++){ const t = 3 + Math.floor((8 - x) * 0.6 * up + (up < 0 ? 5 : 0)); rect(G, x, t, x, t + 3 + (x % 3 ? 1 : 0), 'r'); if (G[t]) G[t][x] = 'L'; }
  for (let x = 15; x <= 22; x++){ const t = 3 + Math.floor((x - 15) * 0.6 * up + (up < 0 ? 5 : 0)); rect(G, x, t, x, t + 3 + (x % 3 ? 1 : 0), 'r'); if (G[t]) G[t][x] = 'L'; }
  rect(G, 9, 3, 14, 9, 'l'); rect(G, 10, 1, 13, 3, 'l');
  G[2][10] = 'M'; G[2][13] = 'M';
  G[4][10] = 'X'; G[4][12] = 'X';
  return outline(G).map(r => r.join(''));
}
// sprite cache
const CACHE = {};
function spr(kind, a, b){
  const key = kind + '|' + a + '|' + (b || 0);
  if (CACHE[key]) return CACHE[key];
  let img;
  if (kind === 'hero') img = px(STAGE_PAL[b], buildHero(a, b), 2);
  else if (kind === 'hound') img = px(PAL, buildHound(a), 2);
  else if (kind === 'levy') img = px(BONE, buildLevy(a), 2);
  else if (kind === 'brigand') img = px(PAL, buildBrigand(a), 2);
  else if (kind === 'wraith') img = px(PAL, buildWraith(a), 2);
  CACHE[key] = img;
  CACHE[key + '|white'] = tinted(img, '#ffffff');
  CACHE[key + '|ash'] = tinted(img, '#241a12');
  return img;
}
const sprWhite = (kind, a, b) => { spr(kind, a, b); return CACHE[kind + '|' + a + '|' + (b || 0) + '|white']; };
const sprAsh   = (kind, a, b) => { spr(kind, a, b); return CACHE[kind + '|' + a + '|' + (b || 0) + '|ash']; };

//======================================================================
// AUDIO
//======================================================================
const AU = {
  ctx: null, music: true, mGain: null, mTimer: null, step: 0,
  init(){
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ return; }
    this.mGain = this.ctx.createGain(); this.mGain.gain.value = 0.14;
    this.mGain.connect(this.ctx.destination);
    this.startMusic();
  },
  tone(f0, f1, dur, type, vol, when){
    if (!this.ctx) return;
    const t = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, hp, when){
    if (!this.ctx) return;
    const t = when || this.ctx.currentTime;
    const n = this.ctx.sampleRate * dur, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 500;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start(t);
  },
  ring(freq, dur, vol){ // metallic ring-out for crits
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    o.type = 'square'; o.frequency.value = freq;
    f.type = 'bandpass'; f.frequency.value = 2000; f.Q.value = 8;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  semi(n){ return Math.pow(2, n / 12); },
  hit(chain){ const p = this.semi(Math.min(chain || 0, 4) * 2); this.tone(90 * p, 60 * p, 0.08, 'square', 0.13); this.noise(0.05, 0.08, 900); },
  crit(){ this.tone(120 * this.semi(5), 80, 0.15, 'square', 0.15); this.noise(0.08, 0.12, 1400); this.ring(660, 0.22, 0.08); },
  kill(chain){ const p = this.semi(Math.min(chain || 0, 4) * 2); this.tone(160 * p, 40, 0.18, 'square', 0.13); this.noise(0.1, 0.1, 700); },
  slash(){ this.noise(0.09, 0.13, 1600); },
  coin(){ this.tone(988, 988, 0.05, 'square', 0.08); this.tone(1319, 1319, 0.12, 'square', 0.08, this.ctx && this.ctx.currentTime + 0.05); },
  emberUp(){ [392, 523, 659].forEach((f, i) => this.tone(f, f, 0.1, 'triangle', 0.1, this.ctx && this.ctx.currentTime + i * 0.05)); },
  bigPickup(){ [262, 330, 392, 523].forEach((f, i) => this.tone(f, f, 0.14, 'triangle', 0.11, this.ctx && this.ctx.currentTime + i * 0.08)); },
  tended(){ [440, 587].forEach((f, i) => this.tone(f, f, 0.18, 'triangle', 0.11, this.ctx && this.ctx.currentTime + i * 0.1)); },
  hurt(){ this.tone(160, 60, 0.14, 'triangle', 0.12); },                       // quiet pain
  die(){ [294, 262, 220, 147].forEach((f, i) => this.tone(f, f, 0.2, 'triangle', 0.1, this.ctx && this.ctx.currentTime + i * 0.16)); },
  growl(){ this.tone(70, 45, 0.25, 'sawtooth', 0.1); },
  clang(){ this.ring(880, 0.18, 0.07); this.tone(220, 180, 0.1, 'square', 0.08); },
  fizzle(){ this.noise(0.04, 0.04, 3000); },
  levelUp(){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [147, 220, 294, 440, 587].forEach((f, i) => this.tone(f, f, 0.5, 'triangle', 0.1, t + i * 0.12));
    this.noise(0.9, 0.05, 300, t);
  },
  stamp(){ this.tone(80, 40, 0.2, 'square', 0.16); this.noise(0.12, 0.12, 400); },
  fireball(){ this.tone(100, 60, 0.25, 'sawtooth', 0.12); this.noise(0.15, 0.1, 500); },
  // -- music: slow D-minor saga loop --
  LEAD: [294, 0, 0, 349, 440, 0, 349, 294, 262, 0, 0, 294, 0, 0, 220, 0,
         294, 0, 0, 349, 440, 0, 523, 440, 466, 0, 440, 349, 294, 0, 0, 0],
  BASS: [73, 73, 73, 73, 58, 58, 58, 58, 49, 49, 49, 49, 55, 55, 55, 55,
         73, 73, 73, 73, 58, 58, 58, 58, 49, 49, 49, 49, 55, 55, 55, 55],
  startMusic(){
    if (this.mTimer || !this.ctx) return;
    const stepDur = 60 / 96 / 2;
    this.mTimer = setInterval(() => {
      if (!this.music) return;
      const t = this.ctx.currentTime + 0.05;
      const i = this.step % 32;
      const lead = this.LEAD[i], bass = this.BASS[i];
      if (lead){
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = lead;
        g.gain.setValueAtTime(0.07, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 1.8);
        o.connect(g); g.connect(this.mGain); o.start(t); o.stop(t + stepDur * 2);
      }
      if (i % 8 === 0){
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = bass;
        g.gain.setValueAtTime(0.13, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 7);
        o.connect(g); g.connect(this.mGain); o.start(t); o.stop(t + stepDur * 8);
      }
      this.step++;
    }, stepDur * 1000);
  },
};

const tileAt = (tx, ty) => (tx < 0 || tx >= LW) ? '#' : (ty < 0 || ty >= LH) ? '.' : grid[ty][tx];
const isSolid = (tx, ty) => tileAt(tx, ty) === '#';
function moveX(e, dx){
  e.x += dx;
  const t0 = Math.floor(e.y / TS), t1 = Math.floor((e.y + e.h - 1) / TS);
  if (dx > 0){
    const tx = Math.floor((e.x + e.w) / TS);
    for (let ty = t0; ty <= t1; ty++) if (isSolid(tx, ty)){ e.x = tx * TS - e.w - 0.01; e.vx = 0; return true; }
  } else if (dx < 0){
    const tx = Math.floor(e.x / TS);
    for (let ty = t0; ty <= t1; ty++) if (isSolid(tx, ty)){ e.x = (tx + 1) * TS + 0.01; e.vx = 0; return true; }
  }
  return false;
}
function moveY(e, dy){
  const prevBottom = e.y + e.h;
  e.y += dy;
  const c0 = Math.floor(e.x / TS), c1 = Math.floor((e.x + e.w - 1) / TS);
  if (dy > 0){
    const ty = Math.floor((e.y + e.h) / TS);
    for (let tx = c0; tx <= c1; tx++){
      const t = tileAt(tx, ty);
      if (t === '#' || (t === '=' && prevBottom <= ty * TS + 0.5)){
        e.y = ty * TS - e.h - 0.01; e.vy = 0; return 'floor';
      }
    }
  } else if (dy < 0){
    const ty = Math.floor(e.y / TS);
    for (let tx = c0; tx <= c1; tx++) if (isSolid(tx, ty)){ e.y = (ty + 1) * TS + 0.01; e.vy = 0; return 'ceil'; }
  }
  return null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function groundAhead(e){
  const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
  const ty = Math.floor((e.y + e.h + 4) / TS), tx = Math.floor(fx / TS);
  const t = tileAt(tx, ty);
  return t === '#' || t === '=';
}

const MAXP = 60;
function burst(x, y, color, n, spd, grav){
  n = Math.min(n, 16);
  for (let i = 0; i < n; i++){
    if (particles.length >= MAXP) particles.shift();
    particles.push({x, y, vx:(Math.random() - 0.5) * (spd || 4), vy:-Math.random() * 3.5 - 0.5,
      life: 22 + Math.random() * 18, color, size: 2 + Math.random() * 3, grav: grav !== undefined ? grav : 0.18});
  }
}
function sparkCone(x, y, dir, n){
  n = Math.min(n, 16);
  for (let i = 0; i < n; i++){
    if (particles.length >= MAXP) particles.shift();
    const a = (Math.random() - 0.5) * 1.05, sp = 4 + Math.random() * 3;
    particles.push({x, y, vx: Math.cos(a) * sp * dir, vy: Math.sin(a) * sp - 1,
      life: 20 + Math.random() * 15, color: Math.random() > 0.5 ? '#ffd75e' : '#ffb347', size: 2, grav: 0.22});
  }
}
function popup(x, y, txt, color, big){ popups.push({x, y, txt, color: color || '#e8d9b0', life: 45, big: !!big}); }
function toast(txt){ toasts.push({txt, t: 0}); }

function rollCrit(heavy){
  if (!hasSteel) return false;
  if (critSuppress > 0){ critSuppress--; critPity++; return false; }
  critPity++;
  const odds = heavy ? 12 : 20;
  if (critPity >= 24 || Math.random() < 1 / odds){
    critPity = 0; critSuppress = 3;
    return true;
  }
  return false;
}
function bankHit(){
  if (!hasCoal) return;
  if (embers >= maxEmbers){ AU.fizzle(); sparkCone(player.x + player.w / 2, player.y + 20, player.dir, 3); return; }
  if (++hitsBanked >= 5){ hitsBanked = 0; embers++; AU.emberUp(); }
}
function bankEmber(){ if (hasCoal && embers < maxEmbers) { embers++; AU.emberUp(); } }
function hurtEnemy(e, dmg, crit, fromX){
  e.hp -= dmg;
  e.flashW = crit ? 2 : 1;
  if (e.hp > 0){
    e.flinch = 8;
    hitstop = crit ? 9 : 4;
    AU.hit(0); if (crit) AU.crit();
    if (crit){ popup(e.x + e.w / 2, e.y - 14, 'THE BLADE CATCHES', '#ffd75e', true); sparkCone(e.x + e.w / 2, e.y + e.h / 2, player.x < e.x ? 1 : -1, 14); shake(2); }
    else burst(e.x + e.w / 2, e.y + e.h / 2, '#c9b89a', 5, 3);
    return;
  }
  // kill
  e.dead = true; killCount++;
  chain = (frame - lastKillF < 90) ? chain + 1 : 1;
  lastKillF = frame; bestChain = Math.max(bestChain, chain);
  const basePts = e.kind === 'L' ? 20 : e.kind === 'H' ? 30 : 60;
  const pts = basePts * (crit ? 2 : 1);
  xp += pts;
  hitstop = crit ? 9 : 4;
  AU.kill(chain - 1); if (crit) AU.crit();
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  popup(cx, e.y - 6, '+' + pts + ' XP', '#c8a05c');
  if (crit) popup(cx, e.y - 22, 'THE BLADE CATCHES', '#ffd75e', true);
  if (chain === 2) popup(cx, e.y - 38, 'DOUBLE!', '#ffb347', true);
  else if (chain === 3){ popup(cx, e.y - 38, 'TRIPLE!', '#ffb347', true); bankEmber(); }
  else if (chain >= 4) popup(cx, e.y - 38, 'RAMPAGE!', '#ff7a3c', true);
  if (crit) shake(2);
  // corpse launch
  const fr = e.kind === 'B' ? (e.st === 'raise' ? 'raise' : 'walk1') : e.kind === 'H' ? 0 : 0;
  corpses.push({kind: e.kind, fr, x: e.x, y: e.y, vx: (cx < fromX ? -3.5 : 3.5), vy: -5,
    rot: 0, vr: (cx < fromX ? -0.2 : 0.2), t: 0, ash: crit, dir: e.dir});
  burst(cx, cy, crit ? '#241a12' : '#c9b89a', crit ? 14 : 8, 4);
}

//======================================================================

//======================================================================
function updatePlayer(){
  const p = player;
  if (p.dead){
    p.vy += 0.4; p.y += p.vy; p.deadT++;
    if (p.deadT > 80){
      lives--;
      if (lives <= 0){
        state = 'gameover';
        saveBest();
      } else resetLevel(true);
    }
    return;
  }
  if (p.ceremony > 0){ // lantern lift at a tended fire
    p.ceremony--; p.vx = 0;
    p.vy = Math.min(p.vy + 0.55, 13);
    moveY(p, p.vy);
    return;
  }
  const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = want * 4.4;
  p.vx += (target - p.vx) * (p.onGround ? 0.25 : 0.12);
  if (Math.abs(p.vx) < 0.05) p.vx = 0;
  if (want) p.dir = want;
  p.coyote = p.onGround ? 7 : Math.max(0, p.coyote - 1);
  p.jumpBuf = keys.jumpHit ? 8 : Math.max(0, p.jumpBuf - 1);
  if (p.jumpBuf > 0 && p.coyote > 0){
    p.vy = -11.8; p.coyote = 0; p.jumpBuf = 0;
    burst(p.x + 11, p.y + p.h, '#8a7a5c', 4, 3);
    AU.noise(0.06, 0.06, 300);
  }
  if (!keys.jump && p.vy < -4) p.vy *= 0.82;
  if (p.atkCd > 0) p.atkCd--;
  if (p.atk > 0) p.atk--;
  if (p.cast > 0) p.cast--;
  if (keys.atkHit && p.atkCd === 0 && p.cast === 0){ p.atk = 14; p.atkCd = 20; p.hitDone = {}; AU.slash(); }
  // fireball (Act II+; engine-ready)
  if (keys.castHit && hasCoal && p.cast === 0 && p.atk === 0 && p.onGround){
    if (embers > 0){
      p.cast = 16;
      embers--;
    } else { popup(p.x + p.w / 2, p.y - 10, 'BRAND RUNS COLD', '#8a95a8'); AU.fizzle(); }
  }
  if (p.cast === 10){ // release frame
    fireballs.push({x: p.x + (p.dir > 0 ? p.w + 6 : -18), y: p.y + 18, vx: 5.0 * p.dir, vy: -0.4, w: 12, h: 12, t: 0});
    AU.fireball(); shake(1);
  }
  p.vy = Math.min(p.vy + 0.55, 13);
  moveX(p, p.vx);
  const wasAir = !p.onGround;
  p.onGround = moveY(p, p.vy) === 'floor';
  if (p.onGround && wasAir && p.vy >= 0) burst(p.x + 11, p.y + p.h, '#8a7a5c', 3, 3);
  if (p.inv > 0) p.inv--;
  if (p.redFlash > 0) p.redFlash--;
  p.animT += Math.abs(p.vx) * 0.055 + 0.02;
  // running footfall dust + stage ember trail
  if (p.onGround && Math.abs(p.vx) > 3 && frame % 8 === 0) burst(p.x + 11, p.y + p.h - 2, '#6b5a44', 2, 1.5);
  if (stage >= 1 && frame % 10 === 0 && Math.abs(p.vx) > 1)
    burst(p.x + p.w / 2 - p.dir * 8, p.y + 16, '#e88a34', 1, 1, -0.02);
  if (p.y > LH * TS + 80){ p.hp = 0; killPlayer(); }
  // checkpoints
  for (const c of checkpoints) if (!c.lit && Math.abs(p.x - c.x) < 52 && Math.abs(p.y + p.h - (c.y + TS)) < 150){
    c.lit = true; p.hp = maxHearts; embers = maxEmbers * (hasCoal ? 1 : 0); hitsBanked = 0;
    p.ceremony = 50;
    AU.tended(); toast('TENDED.');
    burst(c.x + 16, c.y + 8, '#ffb347', 10, 2, 0.02);
  }
  // act end
  if (p.x > 238 * TS && state === 'play'){
    state = 'grade'; computeGrade(); AU.stamp(); saveBest();
  }
}
function updateEnemies(){
  const p = player, sb = (!p.dead && !transform) ? swordBox() : null;
  for (const e of enemies){
    if (e.dead) continue;
    e.t++;
    if (e.flinch > 0){ e.flinch--; }
    else if (e.kind === 'L'){
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
    } else if (e.kind === 'H'){
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++;
      if (e.st === 'patrol'){
        if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
        const dx = p.x - e.x, sameLevel = Math.abs((p.y + p.h) - (e.y + e.h)) < 48;
        if (!p.dead && sameLevel && Math.abs(dx) < 260 && Math.sign(dx) === e.dir){
          e.st = 'windup'; e.stT = 0; e.vx = 0; AU.growl();
        }
      } else if (e.st === 'windup'){
        if (e.stT > 24){ e.st = 'charge'; e.stT = 0; e.dir = p.x > e.x ? 1 : -1; }
      } else if (e.st === 'charge'){
        const hitWall = moveX(e, 3.4 * e.dir);
        if (hitWall || (onG && !groundAhead(e)) || e.stT > 70){ e.st = 'tired'; e.stT = 0; }
      } else { // tired
        if (e.stT > 36){ e.st = 'patrol'; e.vx = 0.8 * e.dir; }
      }
    } else if (e.kind === 'B'){
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++;
      if (e.st === 'walk'){
        if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
        const dx = p.x - (e.x + e.w / 2);
        if (!p.dead && Math.abs(dx) < 92 && Math.abs((p.y + p.h) - (e.y + e.h)) < 40){
          e.st = 'raise'; e.stT = 0; e.dir = dx > 0 ? 1 : -1; AU.clang();
        }
      } else if (e.st === 'raise'){
        if (e.stT > 30){ e.st = 'swing'; e.stT = 0; AU.noise(0.1, 0.12, 400); shake(2); }
      } else if (e.st === 'swing'){
        if (e.stT < 12 && !p.dead){
          const hb = {x: e.dir > 0 ? e.x + e.w : e.x - 44, y: e.y + 16, w: 44, h: 44};
          if (overlap(hb, p)) hurtPlayer(e.x + e.w / 2, 1);
        }
        if (e.stT > 12){ e.st = 'recover'; e.stT = 0; }
      } else {
        if (e.stT > 40){ e.st = 'walk'; e.vx = 0.5 * e.dir; }
      }
    }
    if (e.flashW > 0) e.flashW--;
    if (p.dead || transform) continue;
    // sword
    if (sb && !p.hitDone['e' + enemies.indexOf(e)] && overlap(sb, e)){
      p.hitDone['e' + enemies.indexOf(e)] = true;
      const crit = rollCrit(e.kind === 'B');
      bankHit();
      hurtEnemy(e, crit ? 2 : 1, crit, p.x + p.w / 2);
      continue;
    }
    // stomp / touch
    if (overlap(p, e)){
      if (p.vy > 1 && p.y + p.h - e.y < 20){
        p.vy = -8.5;
        hurtEnemy(e, e.kind === 'B' ? 1 : 1, false, p.x + p.w / 2);
        if (e.kind === 'B' && !e.dead){ e.flinch = 14; }
      } else if (!(e.kind === 'B' && (e.st === 'raise'))){
        hurtPlayer(e.x + e.w / 2, 1);
      }
    }
  }
  // fireballs
  for (let i = fireballs.length - 1; i >= 0; i--){
    const f = fireballs[i];
    f.t++; f.vy += 0.06; f.x += f.vx; f.y += f.vy;
    burst(f.x + 6, f.y + 6, '#ffb347', 1, 1, 0);
    const tx = Math.floor((f.x + 6) / TS), ty = Math.floor((f.y + 6) / TS);
    let dead = isSolid(tx, ty) || f.t > 160;
    for (const e of enemies){
      if (e.dead || !overlap(f, e)) continue;
      hurtEnemy(e, 2, false, f.x);
      hitstop = Math.max(hitstop, 5);
      if (e.kind === 'B'){ dead = true; break; } // stops on heavies, pierces fodder
    }
    if (dead){ burst(f.x + 6, f.y + 6, '#ff7a3c', 10, 3); fireballs.splice(i, 1); }
  }
}
function updateItems(){

function updateFx(){
  for (let i = particles.length - 1; i >= 0; i--){
    const q = particles[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.grav; q.life--;
    if (q.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--){
    const q = popups[i]; q.y -= q.big ? 1.0 : 0.7; q.life--;
    if (q.life <= 0) popups.splice(i, 1);
  }
  for (let i = corpses.length - 1; i >= 0; i--){
    const c = corpses[i];
    c.t++; c.x += c.vx; c.y += c.vy; c.vy += 0.35; c.rot += c.vr;
    if (c.y > LH * TS + 100 || c.t > 120) corpses.splice(i, 1);

}
function updateCamera(){

// -- the transformation: slow-mo, converge, flash, shockwave --
function maybeLevelUp(){
  if (transform || player.dead) return;
  if (stage < 3 && xp >= STAGE_XP[stage]){
    transform = {t: 0};
    AU.levelUp();
  }
}
function updateTransform(){
  if (!transform) return;
  transform.t++;
  const t = transform.t;
  timeScale = t < 20 ? 1 - (t / 20) * 0.75 : t < 65 ? 0.25 : 1;
  if (t < 65 && t % 2 === 0){
    // converging embers
    const a = hash(t, 3) * 6.283, r = 130 + hash(t, 7) * 60;
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    if (particles.length >= MAXP) particles.shift();
    particles.push({x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r,
      vx: -Math.cos(a) * r / 22, vy: -Math.sin(a) * r / 22, life: 22, color: '#ffb347', size: 3, grav: 0});
  }
  if (t === 65){
    stage++;
    hitstop = 6; shake(4);
    toast(stage === 1 ? 'SPARK. THE EMBER STIRS.' : stage === 2 ? 'KINDLED. THE VISOR BRIGHTENS.' : 'ABLAZE. HOW BRIGHTLY YOU BURN.');
    // shockwave: kill fodder, stagger heavies
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    for (const e of enemies){
      if (e.dead) continue;
      const d = Math.hypot(e.x + e.w / 2 - cx, e.y + e.h / 2 - cy);
      if (d < 200){
        if (e.kind === 'B'){ e.flinch = 40; burst(e.x + e.w / 2, e.y + 10, '#ffb347', 6, 3); }
        else hurtEnemy(e, 9, false, cx);
      }
    }
    burst(cx, cy, '#ffd75e', 16, 7, 0.02);
    transform.wave = 1;
  }
  if (transform.wave) transform.wave += 14;
  if (t > 85){ transform = null; timeScale = 1; }
}
function computeGrade(){
  const secs = playTime / 60;
  const killPct = killTotal ? killCount / killTotal : 1;
  let score = 0;
  score += deaths === 0 ? 3 : deaths === 1 ? 2 : deaths === 2 ? 1 : 0;
  score += secs < 240 ? 2 : secs < 360 ? 1 : 0;
  score += killPct >= 0.9 ? 2 : killPct >= 0.6 ? 1 : 0;
  score += bestChain >= 3 ? 1 : 0;
  grade = {letter: score >= 8 ? 'S' : score >= 6 ? 'A' : score >= 4 ? 'B' : score >= 2 ? 'C' : 'D',
    secs, killPct, t: 0};
}
function saveBest(){
  try {
    if (xp > (best.xp || 0)) best.xp = xp;
    if (grade && (!best.grade || 'DCBAS'.indexOf(grade.letter) > 'DCBAS'.indexOf(best.grade))) best.grade = grade.letter;
    localStorage.setItem('emberward', JSON.stringify(best));
  } catch (e) {}
}

function ridge(par, base, amp1, f1, amp2, f2, color){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, VH);
  for (let sx = 0; sx <= VW; sx += 8){
    const wx = sx + cam.x * par;
    const y = base - Math.abs(Math.sin(wx * f1)) * amp1 - Math.abs(Math.sin(wx * f2 + 2)) * amp2;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(VW, VH); ctx.fill();
}
function deadTree(x, base, h, color, sd){
  ctx.fillStyle = color;

  for (let b = 0; b < 3; b++){
    const by = base - h + 8 + b * (h / 3.4), lean = hash(sd, b) > 0.5 ? 1 : -1;
    ctx.save(); ctx.translate(x + 3, by);
    ctx.rotate(lean * (0.45 + hash(sd, b + 9) * 0.5));
    ctx.fillRect(0, -2, 20 + hash(sd, b + 3) * 26, 3);
    ctx.restore();
  }
}

      ctx.fillStyle = '#160d08';
      ctx.fillRect(sx + 10, g - 34, 3, 8); ctx.fillRect(sx + 31, g - 34, 3, 8);
      ctx.fillStyle = '#443019'; ctx.fillRect(sx + 8, g - 27, 8, 9);          // one old lantern
      if (d.t === 'shrine2'){ ctx.fillStyle = '#6b4a2e'; ctx.fillRect(sx + 16, g - 8, 12, 8);
        const gl = ctx.createRadialGradient(sx + 22, g - 4, 2, sx + 22, g - 4, 20);
        gl.addColorStop(0, 'rgba(255,170,70,.25)'); gl.addColorStop(1, 'rgba(255,170,70,0)');
        ctx.fillStyle = gl; ctx.fillRect(sx, g - 26, 44, 30); }               // the warm stone
    } else if (d.t === 'well'){
      ctx.fillStyle = '#4a3a28'; ctx.fillRect(sx, g - 26, 52, 26);
      ctx.fillStyle = '#2a1c10'; ctx.fillRect(sx + 8, g - 20, 36, 16);
      ctx.fillStyle = '#241812'; ctx.fillRect(sx + 4, g - 58, 5, 34); ctx.fillRect(sx + 43, g - 58, 5, 34);
      ctx.fillRect(sx, g - 62, 52, 6);
      ctx.fillStyle = '#443019'; ctx.fillRect(sx + 24, g - 56, 3, 10);        // burnt rope stub
      ctx.fillStyle = '#5f4526'; ctx.fillRect(sx + 62, g - 6, 10, 4); ctx.fillRect(sx + 64, g - 8, 6, 2); // the collar
    } else if (d.t === 'mill'){
      ctx.fillStyle = '#2e2015';
      ctx.beginPath(); ctx.moveTo(sx, g); ctx.lineTo(sx + 14, g - 150); ctx.lineTo(sx + 66, g - 150); ctx.lineTo(sx + 80, g); ctx.fill();
      ctx.fillStyle = '#241812'; ctx.fillRect(sx + 30, g - 40, 22, 40);
      const hub = {x: sx + 40, y: g - 150};
      for (let s = 0; s < 4; s++){
        const a = frame * 0.004 + s * Math.PI / 2;
        ctx.save(); ctx.translate(hub.x, hub.y); ctx.rotate(a);
        ctx.fillStyle = '#241812'; ctx.fillRect(-3, -74, 6, 74);
        ctx.fillStyle = '#2e2015'; ctx.fillRect(-10, -74, 20, 40);
        ctx.restore();
        if (s === 0 && frame % 6 === 0){
          const fx = hub.x + Math.sin(a) * 60 + cam.x, fy = hub.y - Math.cos(a) * 60;
          burst(fx - cam.x + cam.x, fy, '#ff7a3c', 1, 1, 0.02); // burning sail embers
        }
      }
      flame(hub.x + Math.sin(frame * 0.004) * 60, hub.y - Math.cos(frame * 0.004) * 60, 5, 9, false);
    } else if (d.t === 'cart'){
      ctx.save(); ctx.translate(sx, g); ctx.rotate(-0.08);
      ctx.fillStyle = '#3a2a1c'; ctx.fillRect(0, -34, 74, 24);
      ctx.fillStyle = '#241812'; ctx.beginPath(); ctx.arc(16, -6, 12, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(58, -8, 12, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#8c3040'; ctx.fillRect(sx + 82, g - 6, 6, 6);          // spilled toys
      ctx.fillStyle = '#4a6a8c'; ctx.fillRect(sx + 94, g - 5, 5, 5);
      ctx.fillStyle = '#c2a05c'; ctx.fillRect(sx + 104, g - 4, 4, 4);
    } else if (d.t === 'firepit'){
      ctx.fillStyle = '#160d08'; ctx.beginPath(); ctx.ellipse(sx + 30, g - 2, 34, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9b89a'; ctx.fillRect(sx + 12, g - 6, 10, 3); ctx.fillRect(sx + 40, g - 5, 8, 3);
      ctx.fillStyle = '#c8a05c'; ctx.fillRect(sx + 26, g - 5, 3, 3); ctx.fillRect(sx + 50, g - 6, 3, 3);
      ctx.fillStyle = '#443019'; ctx.fillRect(sx + 20, g - 10, 5, 8); ctx.fillRect(sx + 36, g - 9, 4, 7);
    }
  }
  // wraith tease over the mill (seg 5)
  if (cam.x > 118 * TS && cam.x < 152 * TS){
    const wx = 120 * TS + ((frame * 0.9) % (34 * TS)) - cam.x;
    const wy = 120 + Math.sin(frame * 0.03) * 28;
    ctx.globalAlpha = 0.55;
    ctx.drawImage(spr('wraith', (frame / 10 | 0) % 2), wx, wy);
    ctx.globalAlpha = 1;
  }
}
function drawCheckpoints(){
  for (const c of checkpoints){
    const sx = c.x - cam.x + 12;
    if (sx < -60 || sx > VW + 60) continue;
    ctx.fillStyle = '#443019'; ctx.fillRect(sx - 2, c.y - 20, 5, 52);
    ctx.fillStyle = '#2a1c10'; ctx.fillRect(sx - 5, c.y - 26, 11, 8);
    if (c.lit) flame(sx, c.y - 30, 8, c.x, true);
    else { ctx.fillStyle = '#241812'; ctx.beginPath(); ctx.ellipse(sx, c.y - 26, 4, 5, 0, 0, 7); ctx.fill(); }
  }
}
function drawItems(){
  for (const it of items){
    if (it.taken) continue;
    const sx = it.x - cam.x + 16, sy = it.y + 16 + Math.sin(it.t) * 3;
    if (sx < -40 || sx > VW + 40) continue;
    if (it.kind === 'c'){
      const sq = Math.abs(Math.cos(it.t * 1.4));
      ctx.fillStyle = '#7a5c26'; ctx.beginPath(); ctx.ellipse(sx, sy, 7 * Math.max(sq, 0.2), 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#c8a05c'; ctx.beginPath(); ctx.ellipse(sx, sy, 5.5 * Math.max(sq, 0.16), 6.5, 0, 0, 7); ctx.fill();
    } else if (it.kind === 'e'){
      flame(sx, sy, 6, it.x, true);
    } else if (it.kind === 'f'){
      ctx.fillStyle = '#8a95a8'; ctx.fillRect(sx - 7, sy - 3, 14, 6);
      ctx.fillStyle = '#5c6675'; ctx.fillRect(sx - 5, sy - 1, 10, 2);
      ctx.fillStyle = '#443019'; ctx.fillRect(sx - 2, sy - 7, 4, 5);
      if (frame % 20 < 3) sparkCone(sx + cam.x, sy, 1, 1);
    } else if (it.kind === 'S'){
      ctx.fillStyle = '#6b4a2e'; ctx.fillRect(sx - 8, sy - 6, 16, 12);
      ctx.fillStyle = '#8a5c36'; ctx.fillRect(sx - 5, sy - 3, 10, 6);
      const gl = ctx.createRadialGradient(sx, sy, 2, sx, sy, 26);
      gl.addColorStop(0, 'rgba(255,170,70,.3)'); gl.addColorStop(1, 'rgba(255,170,70,0)');
      ctx.fillStyle = gl; ctx.fillRect(sx - 26, sy - 26, 52, 52);
    }
  }
}
function drawSprite(img, x, y, flip){
  ctx.save();
  if (flip){ ctx.translate(x + img.width, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); }
  else ctx.drawImage(img, x, y);
  ctx.restore();
}
function enemyAnchor(e, img){
  return {x: e.x + e.w / 2 - img.width / 2 - cam.x, y: e.y + e.h - img.height};
}
function drawEnemies(){
  for (const e of enemies){
    if (e.dead) continue;
    let img;
    if (e.kind === 'L') img = spr('levy', (e.t / 12 | 0) % 2);
    else if (e.kind === 'H') img = spr('hound', e.st === 'windup' ? 2 : (e.t / (e.st === 'charge' ? 4 : 8) | 0) % 2);
    else img = spr('brigand', e.st === 'raise' ? 'raise' : e.st === 'swing' ? 'swing' : (e.t / 14 | 0) % 2 ? 'walk2' : 'walk1');
    const a = enemyAnchor(e, img);
    if (a.x < -120 || a.x > VW + 120) continue;
    if (e.flashW > 0) img = e.kind === 'L' ? sprWhite('levy', (e.t / 12 | 0) % 2) : e.kind === 'H' ? sprWhite('hound', 0) : sprWhite('brigand', 'walk1');
    drawSprite(img, a.x, a.y, e.dir < 0);
    if (e.kind === 'B' && e.st === 'raise' && (e.stT / 4 | 0) % 2){ // telegraph blink
      ctx.fillStyle = 'rgba(255,180,80,.5)';
      ctx.fillRect(a.x + (e.dir > 0 ? img.width - 8 : 2), a.y - 4, 6, 6);
    }
  }
  for (const c of corpses){
    const img = c.ash
      ? (c.kind === 'L' ? sprAsh('levy', 0) : c.kind === 'H' ? sprAsh('hound', 0) : sprAsh('brigand', 'walk1'))
      : (c.t < 3
        ? (c.kind === 'L' ? sprWhite('levy', 0) : c.kind === 'H' ? sprWhite('hound', 0) : sprWhite('brigand', 'walk1'))
        : (c.kind === 'L' ? spr('levy', 0) : c.kind === 'H' ? spr('hound', 0) : spr('brigand', 'walk1')));
    ctx.save();
    ctx.translate(c.x - cam.x + img.width / 2, c.y + img.height / 2);
    ctx.rotate(c.rot);
    ctx.globalAlpha = Math.max(0, 1 - c.t / 110);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  for (const f of fireballs){
    flame(f.x + 6 - cam.x, f.y + 6, 7, 1, false);
  }
}
function drawPlayer(){
  const p = player;
  if (p.inv > 0 && !p.dead && (p.inv / 4 | 0) % 2) return;
  let pose = 'idle';
  if (p.atk > 0 || p.cast > 0) pose = 'slash';
  else if (!p.onGround) pose = 'jump';
  else if (Math.abs(p.vx) > 0.4) pose = (p.animT / 0.55 | 0) % 2 ? 'run1' : 'run2';
  let img = spr('hero', pose, stage);
  if (p.redFlash > 0) img = tinted(img, 'rgba(220,60,50,0.9)');
  if (transform && transform.t >= 65 && transform.t < 68) img = sprWhite('hero', pose, stage);
  const cx = p.x + p.w / 2 - cam.x;
  const dx = cx - img.width / 2 + (p.dir > 0 ? 4 : -4);
  const dy = p.y + p.h - img.height;
  if (p.dead){
    ctx.save();
    ctx.translate(cx, dy + img.height / 2);
    ctx.rotate(p.deadT * 0.12 * p.dir);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
    return;
  }
  drawSprite(img, dx, dy, p.dir < 0);
  // slash arc flash
  if (p.atk > 8 && p.atk < 13){
    ctx.strokeStyle = 'rgba(255,245,220,.85)'; ctx.lineWidth = 3;
    ctx.beginPath();
    const ax = p.dir > 0 ? p.x + p.w + 16 - cam.x : p.x - 16 - cam.x;
    ctx.arc(ax, p.y + 20, 22, p.dir > 0 ? -1.2 : Math.PI - 0.4, p.dir > 0 ? 0.4 : Math.PI + 1.2);
    ctx.stroke();
  }
  // lantern lift ceremony
  if (p.ceremony > 10){
    ctx.fillStyle = '#160d08';
    ctx.fillRect(cx + p.dir * 14, p.y + 4, 8, 10);
    ctx.fillStyle = '#443019';
    ctx.fillRect(cx + p.dir * 14 + 2, p.y + 1, 4, 3);
  }
  // visor cast-light at Ablaze
  if (stage >= 3){
    const g = ctx.createRadialGradient(cx + p.dir * 8, p.y + 12, 4, cx + p.dir * 8, p.y + 12, 60);
    g.addColorStop(0, 'rgba(255,190,110,.14)'); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 60, p.y - 48, 128, 128);
  }
  // transformation shockwave ring
  if (transform && transform.wave){
    ctx.strokeStyle = 'rgba(255,200,120,' + Math.max(0, 1 - transform.wave / 220) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, p.y + p.h / 2, transform.wave, 0, 7); ctx.stroke();
  }
}
function drawFx(){
  for (const q of particles){
    ctx.globalAlpha = Math.min(1, q.life / 14);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - cam.x, q.y, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  for (const q of popups){
    ctx.globalAlpha = Math.min(1, q.life / 18);
    text(q.txt, q.x - cam.x, q.y, q.big ? 17 : 14, q.color);
  }
  ctx.globalAlpha = 1;
}
function text(str, x, y, size, color, align){
  ctx.textAlign = align || 'center';
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.fillStyle = 'rgba(12,6,4,.9)';
  ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function drawHUD(){
  // hearts: ember-diamonds
  for (let i = 0; i < maxHearts; i++){
    const hx = 26 + i * 25, hy = 24;
    ctx.beginPath(); ctx.moveTo(hx, hy - 9); ctx.lineTo(hx + 8, hy); ctx.lineTo(hx, hy + 11); ctx.lineTo(hx - 8, hy); ctx.closePath();
    ctx.fillStyle = i < player.hp ? '#a03a28' : '#241a14'; ctx.fill();
    if (i < player.hp){ ctx.fillStyle = '#e8722c'; ctx.fillRect(hx - 2, hy - 3, 4, 5); }
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // lantern + coals = lives
  ctx.fillStyle = '#160d08'; ctx.fillRect(18, 42, 14, 16);
  ctx.fillStyle = '#443019'; ctx.fillRect(21, 39, 8, 4);
  for (let i = 0; i < 3; i++){
    ctx.fillStyle = i < lives ? '#e8722c' : '#2a2018';
    ctx.beginPath(); ctx.arc(42 + i * 13, 51, 4, 0, 7); ctx.fill();
  }
  // embers in the blade (after the Coal)
  if (hasCoal){
    ctx.fillStyle = '#8a95a8'; ctx.fillRect(18, 68, 30, 4);
    ctx.fillStyle = '#c2762e'; ctx.fillRect(14, 67, 5, 6);
    for (let i = 0; i < maxEmbers; i++){
      ctx.fillStyle = i < embers ? '#ffb347' : '#2a2018';
      ctx.beginPath(); ctx.arc(56 + i * 12, 70, 4, 0, 7); ctx.fill();
    }
  }
  // xp + stage
  text('XP ' + xp + (stage > 0 ? '   ·   ' + STAGE_NAMES[stage] : ''), 18, 96, 14, '#c8a05c', 'left');
  text('' + coins, 60, 118, 14, '#c8a05c', 'left');
  ctx.fillStyle = '#c8a05c'; ctx.beginPath(); ctx.ellipse(46, 113, 6, 7, 0, 0, 7); ctx.fill();
  const secs = playTime / 60 | 0;
  text((secs / 60 | 0) + ':' + ('0' + secs % 60).slice(-2), VW - 20, 28, 15, '#c8b490', 'right');
  // toasts
  toasts.forEach((tt, i) => {
    ctx.globalAlpha = tt.t < 20 ? tt.t / 20 : tt.t > 120 ? Math.max(0, (150 - tt.t) / 30) : 1;
    text(tt.txt, VW / 2, VH - 64 - i * 24, 17, '#e8d9b0');
  });
  ctx.globalAlpha = 1;
}
function scanlines(){
  ctx.fillStyle = 'rgba(0,0,0,.06)';
  for (let y = 0; y < VH; y += 4) ctx.fillRect(0, y, VW, 2);
}
function vignette(dark){
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.95);
  g.addColorStop(0, 'rgba(10,5,3,0)'); g.addColorStop(1, 'rgba(10,5,3,' + (dark || 0.45) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}
function drawWorld(){
  ctx.save();
  if (cam.shake > 0) ctx.translate((Math.random() - 0.5) * cam.shake, (Math.random() - 0.5) * cam.shake);
  drawSky(); drawParallax(); drawTiles(); drawDecor(); drawCheckpoints();
  drawItems(); drawEnemies();
  if (transform && transform.t < 65){
    ctx.fillStyle = 'rgba(10,5,3,.4)'; ctx.fillRect(-10, -10, VW + 20, VH + 20);
  }
  drawPlayer(); drawFx();
  ctx.restore();
  vignette();
}

//======================================================================
// SCREENS
//======================================================================
function ornament(x, y, w, color){
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x - 16, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 16, y); ctx.lineTo(x + w / 2, y); ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillRect(-5, -5, 10, 10); ctx.restore();
  ctx.fillRect(x - w / 2 - 3, y - 3, 6, 6); ctx.fillRect(x + w / 2 - 3, y - 3, 6, 6);
}
function titleScreen(){
  cam.x = (cam.x + 0.35) % (LW * TS - VW);
  drawSky(); drawParallax(); drawTiles(); drawDecor(); scanlines();
  ctx.fillStyle = 'rgba(12,6,4,.5)'; ctx.fillRect(0, 0, VW, VH);
  const bob = Math.sin(frame * 0.04) * 5;
  ornament(VW / 2, 128 + bob, 460, '#8a6a3a');
  text('EMBERWARD', VW / 2, 218 + bob, 92, '#e8b23a');
  text('A  T A L E   O F   C A L D E R M A R K', VW / 2, 258 + bob, 17, '#c8956a');
  ornament(VW / 2, 288 + bob, 460, '#8a6a3a');
  drawSprite(spr('hero', 'idle', 0), VW / 2 - 38, 330 + Math.sin(frame * 0.07) * 4, false);
  if ((frame / 32 | 0) % 2) text('PRESS ENTER TO KEEP THE FLAME', VW / 2, 452, 22, '#f3ead6');
  text('ARROWS / WASD move     Z / SPACE jump     X / J sword', VW / 2, 492, 14, '#a89878');
  text('M music     P pause' + (best.grade ? '     BEST GRADE ' + best.grade : ''), VW / 2, 514, 14, '#a89878');
}
function drawCard(){
  drawWorld(); scanlines();
  card.t++;
  const a = Math.min(1, card.t / 30) * (card.t > card.dur - 30 ? Math.max(0, (card.dur - card.t) / 30) : 1);
  ctx.fillStyle = 'rgba(12,6,4,' + 0.75 * a + ')'; ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = a;
  if (card.title) text(card.title, VW / 2, VH / 2 - 58, 30, '#e8b23a');
  card.lines.forEach((l, i) => text(l, VW / 2, VH / 2 + i * 34 - (card.title ? 0 : 20), 21, '#e8d9b0'));
  ctx.globalAlpha = 1;
  if (card.t > card.dur || (card.t > 40 && keys.startHit)){
    state = card.next; card = null;
  }
}
function gradeScreen(){
  drawWorld(); scanlines();
  grade.t++;
  ctx.fillStyle = 'rgba(12,6,4,.7)'; ctx.fillRect(0, 0, VW, VH);
  ornament(VW / 2, 108, 480, '#8a6a3a');
  text('ACT I CLEAR — THE ASH HARVEST', VW / 2, 156, 28, '#e8b23a');
  const secs = grade.secs | 0;
  text('TIME  ' + (secs / 60 | 0) + ':' + ('0' + secs % 60).slice(-2), VW / 2, 214, 19, '#e8d9b0');
  text('THE FALLEN  ' + killCount + ' / ' + killTotal, VW / 2, 246, 19, '#e8d9b0');
  text('COALS SPENT  ' + deaths + '      BEST CHAIN  ' + bestChain, VW / 2, 278, 19, '#e8d9b0');
  text('XP  ' + xp, VW / 2, 310, 19, '#c8a05c');
  if (grade.t > 40){
    const gs = grade.t < 48 ? 3 - (grade.t - 40) * 0.25 : 1;
    if (grade.t === 48){ shake(4); }
    ctx.save();
    ctx.translate(VW / 2, 392);
    ctx.scale(gs, gs);
    text(grade.letter, 0, 22, 84, grade.letter === 'S' ? '#ffd75e' : grade.letter === 'A' ? '#e8b23a' : '#c8b490');
    ctx.restore();
  }
  ornament(VW / 2, 452, 480, '#8a6a3a');
  if (grade.t > 70 && (frame / 30 | 0) % 2) text('PRESS ENTER', VW / 2, 496, 18, '#f3ead6');
  if (grade.t > 70 && keys.startHit){
    card = {title: '', lines: ['TO BE CONTINUED', 'ACT II — THE COLD HEARTH'], t: 0, dur: 240, next: 'title'};
    state = 'card';
  }
}
function gameoverScreen(){
  drawWorld(); scanlines();
  ctx.fillStyle = 'rgba(12,6,4,.78)'; ctx.fillRect(0, 0, VW, VH);
  text('The lantern is empty.', VW / 2, 236, 30, '#c8b490');
  text('The wind takes the rest.', VW / 2, 278, 22, '#8a7a64');
  text('XP  ' + xp + (best.xp ? '      BEST  ' + best.xp : ''), VW / 2, 336, 19, '#c8a05c');
  if ((frame / 30 | 0) % 2) text('PRESS ENTER', VW / 2, 408, 18, '#f3ead6');
  if (keys.startHit) state = 'title';
}

//======================================================================
// MAIN LOOP
//======================================================================
resetLevel(false);
state = 'title';
let acc = 0, last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60){ acc -= 1000 / 60; frameStep(); }
}
function frameStep(){
  frame++;
  if (state === 'title'){
    titleScreen();
    if (keys.startHit){
      resetLevel(false);
      card = {title: 'ACT I — THE ASH HARVEST', lines: ['The wind carried it east.', 'So he walked east.'], t: 0, dur: 260, next: 'play'};
      state = 'card';
    }
  } else if (state === 'card'){
    drawCard();
  } else if (state === 'play'){
    if (keys.pauseHit) paused = !paused;
    if (!paused){
      if (hitstop > 0){ hitstop--; }
      else {
        updateTransform();
        pendingSteps += timeScale;
        while (pendingSteps >= 1){
          pendingSteps--;
          playTime++;
          updatePlayer(); updateEnemies(); updateItems(); updateFx();
        }
        updateCamera();
        maybeLevelUp();
      }
    }
    drawWorld(); drawHUD(); scanlines();
    if (paused){
      ctx.fillStyle = 'rgba(12,6,4,.55)'; ctx.fillRect(0, 0, VW, VH);
      text('PAUSED', VW / 2, VH / 2, 44, '#f3ead6');
    }
  } else if (state === 'grade'){
    gradeScreen();
  } else if (state === 'gameover'){
    gameoverScreen();
  }
  keys.jumpHit = keys.atkHit = keys.castHit = keys.startHit = keys.pauseHit = false;
}
requestAnimationFrame(tick);
</script>
