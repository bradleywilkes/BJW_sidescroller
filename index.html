<script>
'use strict';
//======================================================================
//  EMBERWARD -- A Tale of Caldermark
//  Act I: The Ash Harvest
//  "The fire that warms and the fire that eats are the same fire."
//======================================================================
const TS = 32, VW = 960, VH = 544;
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fitCanvas(){
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  cvs.style.width  = Math.floor(VW * s) + 'px';
  cvs.style.height = Math.floor(VH * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };
const FONT = "'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif";

//======================================================================
// SPRITES -- procedural pixel painter (paint shaded regions, auto-outline)
//======================================================================
function newGrid(w, h){ return Array.from({length: h}, () => Array(w).fill('.')); }
function rect(G, x0, y0, x1, y1, c){ for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (G[y] && G[y][x] !== undefined) G[y][x] = c; }
function seg(G, x0, y0, x1, y1, c, th){
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++){
    const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
    rect(G, x, y, x + th - 1, y + th - 1, c);
  }
}
function outline(G){
  const h = G.length, w = G[0].length, out = G.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (G[y][x] !== '.') continue;
    const n = [[0,1],[0,-1],[1,0],[-1,0]].some(([dx, dy]) => {
      const row = G[y + dy]; const c = row && row[x + dx]; return c && c !== '.' && c !== 'O'; });
    if (n) out[y][x] = 'O';
  }
  return out;
}
function texture(G){
  const h = G.length, w = G[0].length;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const c = G[y][x];
    if (c === '2' && hash(x, y) > 0.84) G[y][x] = '3';
    else if (c === '3' && hash(x + 9, y) < 0.10) G[y][x] = '2';
    else if (c === 'R' && hash(x * 3, y) > 0.86) G[y][x] = 'r';
    else if (c === 'L' && hash(x, y * 3) > 0.86) G[y][x] = 'M';
  }
}
function px(pal, rows, scale){
  const c = document.createElement('canvas');
  c.width = rows[0].length * scale; c.height = rows.length * scale;
  const g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++){
    const col = pal[rows[y][x]];
    if (col){ g.fillStyle = col; g.fillRect(x * scale, y * scale, scale, scale); }
  }
  return c;
}
function tinted(img, color){ // white/black silhouette for flashes
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
// -- ember warpath palette --
const PAL = {W:'#e8dcc2', w:'#a08a5c', O:'#160d08', '1':'#2e2417', '2':'#5a4526', '3':'#8a6d3a', '4':'#c2a05c',
  r:'#4a1a12', R:'#7a2e1c', Q:'#a04428', l:'#2a1c10', L:'#443019', M:'#5f4526',
  g:'#c2762e', G:'#c2762e', X:'#c96a2e', s:'#7a5a44', S:'#a67c5c'};
const BONE = {O:'#160d08', '4':'#c9b89a', '3':'#a89878', '2':'#5a4526', M:'#5f4526', L:'#443019', X:'#6e2416', W:'#e8dcc2', w:'#a08a5c', G:'#c2762e'};
// enemy palette: eye-slits stay DARK -- only the hero, Selwyn, and kept fires glow
const ENPAL = {...PAL, X:'#6e2416'};
// per-enemy palettes tuned to READ against the dark earth/stone -- matte, no glow
const HOUNDPAL = {O:'#160d08', l:'#4a443a', L:'#767061', M:'#9c9482', W:'#e8dcc2', X:'#6e2416'};
const IMPPAL   = {O:'#160d08', l:'#54453c', L:'#8a7466', M:'#a89484', X:'#6e2416'};
const CULTPAL  = {O:'#160d08', R:'#6e3a2e', Q:'#8a4a38', r:'#48281f', s:'#a89484', l:'#2a1c10', L:'#443019', M:'#5f4526'};
const WRPAL    = {O:'#160d08', r:'#6e4a56', l:'#3c3040', L:'#9a8a94', M:'#b0a4ac', X:'#6e2416'};
const BRIGPAL  = {...ENPAL, l:'#332619', L:'#544838', M:'#75664e', R:'#8a3424', '2':'#6e6a5e', '3':'#8f8a7a', '1':'#3c3a32', W:'#c9c4b4'};
// stage palettes: the visor/glow char X brightens; ember cracks use 'E'
const STAGE_PAL = [
  {...PAL, X:'#b05a24', E:'#b05a24'},                    // unawakened: dim flicker
  {...PAL, X:'#e88a34', E:'#e88a34'},                    // SPARK: steady
  {...PAL, X:'#ffb347', E:'#ff9a3c'},                    // KINDLED
  {...PAL, X:'#ffd75e', E:'#ffb347'},                    // ABLAZE
];

//----------------------------------------------------------------------
// THE HEARTHLESS KNIGHT -- 38x36, Rastan stance, closed helm.
// stage 0..3 = unawakened / Spark / Kindled / Ablaze (visible transformation)
//----------------------------------------------------------------------
function buildHero(pose, stage){
  const G = newGrid(38, 36);
  const lunge = pose === 'slash' ? 1 : 0;
  // tattered cape
  for (let y = 12; y <= 29; y++){
    const w = 2 + Math.round((y - 12) * 0.45), x1 = 9 - Math.round((y - 12) * 0.25), x0 = Math.max(1, x1 - w);
    rect(G, x0, y, x1, y, 'R'); G[y][x0] = 'Q';
  }
  [[2,29],[4,28],[1,27],[3,26],[5,29],[2,24]].forEach(([x, y]) => { if (G[y]) G[y][x] = '.'; });
  if (stage >= 2){ // KINDLED: cape hem chars and glows
    for (let y = 26; y <= 29; y++) for (let x = 1; x <= 8; x++) if (G[y][x] === 'R' || G[y][x] === 'Q') G[y][x] = (hash(x, y) > 0.5 ? 'E' : 'r');
  }
  // legs
  if (pose === 'run1'){
    seg(G, 12, 21, 7, 25, '1', 3);  seg(G, 7, 25, 5, 30, '2', 3);   rect(G, 3, 31, 8, 33, 'l');
    seg(G, 14, 21, 19, 25, '2', 3); seg(G, 19, 25, 20, 30, '3', 3); rect(G, 18, 31, 24, 33, 'M');
    rect(G, 18, 31, 24, 31, 'L');
  } else if (pose === 'run2'){
    seg(G, 12, 21, 15, 26, '1', 3); seg(G, 15, 26, 16, 31, '2', 3); rect(G, 14, 32, 19, 34, 'l');
    seg(G, 14, 21, 10, 25, '2', 3); seg(G, 10, 25, 9, 30, '3', 3);  rect(G, 7, 31, 13, 33, 'M');
  } else if (pose === 'jump'){
    seg(G, 12, 21, 9, 24, '1', 3);  seg(G, 9, 24, 10, 27, '2', 3);  rect(G, 8, 28, 13, 30, 'l');
    seg(G, 14, 21, 17, 25, '2', 3); seg(G, 17, 25, 16, 29, '3', 3); rect(G, 14, 30, 20, 32, 'M');
  } else {
    seg(G, 12, 21, 9 + (-lunge), 26, '1', 3); seg(G, 9 - lunge, 26, 8 - lunge, 31, '2', 3); rect(G, 5 - lunge, 32, 11 - lunge, 34, 'l');
    seg(G, 14, 21, 17 + lunge * 2, 26, '2', 3); seg(G, 17 + lunge * 2, 26, 17 + lunge * 2, 31, '3', 3);
    rect(G, 15 + lunge * 2, 32, 21 + lunge * 2, 34, 'M'); rect(G, 15 + lunge * 2, 32, 21 + lunge * 2, 32, 'L');
  }
  // hips + belt
  rect(G, 10, 19, 17, 22, '2'); rect(G, 10, 21, 17, 22, 'L');
  G[21][11] = 'G'; G[21][14] = 'G'; G[21][17] = 'G';
  // torso, forward lean
  for (let y = 12; y <= 19; y++){
    const off = Math.round((19 - y) * 0.4) + lunge;
    rect(G, 10 + off, y, 17 + off, y, '2');
    G[y][17 + off] = '3'; G[y][10 + off] = '1';
  }
  const co = 3 + lunge;
  G[14][12 + co] = 'g'; G[18][11 + lunge] = 'g';
  if (stage >= 2){ G[16][12 + lunge] = 'E'; G[19][12] = 'E'; }               // joint-seam cracks
  if (stage >= 3){ G[15][13 + lunge] = 'E'; G[17][14 + lunge] = 'E'; G[13][14 + co] = 'E'; } // chest cracks
  // fur mantle
  for (let y = 10; y <= 12; y++) for (let x = 9 + co; x <= 19 + co; x++)
    G[y][x] = hash(x, y) > 0.6 ? 'M' : (hash(x + 5, y) > 0.5 ? 'L' : 'l');
  // CLOSED war-helm
  const hx = 13 + co;
  rect(G, hx, 2, hx + 7, 9, '3'); rect(G, hx + 1, 1, hx + 6, 1, '4');
  rect(G, hx, 2, hx, 9, '2');
  rect(G, hx + 7, 3, hx + 7, 8, '4');
  rect(G, hx + 3, 5, hx + 7, 5, '1');
  G[5][hx + 4] = 'X'; G[5][hx + 6] = 'X';
  rect(G, hx + 2, 7, hx + 5, 7, '2'); G[7][hx + 3] = '1'; G[7][hx + 5] = '1';
  rect(G, hx + 2, 9, hx + 5, 10, '2');
  // crest (Ablaze: it burns)
  seg(G, hx + 1, 1, hx - 4, 5, stage >= 3 ? 'E' : 'R', 2);
  G[5][hx - 4] = stage >= 3 ? 'X' : 'Q'; G[2][hx - 1] = stage >= 3 ? 'X' : 'Q';
  // off arm
  rect(G, 9 + co, 12, 12 + co, 14, '3'); rect(G, 9 + co, 14, 12 + co, 15, '2');
  seg(G, 11 + co, 15, 13, 18, '2', 2); rect(G, 13, 17, 14, 18, 'M');
  // lantern on the belt, always dark (the twist rides here)
  rect(G, 13, 19, 15, 21, '1'); G[19][14] = 'l';
  // lead arm + Brand
  rect(G, 15 + co, 12, 19 + co, 14, '4'); rect(G, 15 + co, 14, 19 + co, 15, '3');
  if (pose === 'slash' || pose === 'cast'){
    seg(G, 18 + co, 14, 24, 15, '3', 2);
    rect(G, 25, 13, 26, 15, 'M');
    rect(G, 27, 12, 27, 16, 'G');
    rect(G, 28, 13, 36, 13, 'W'); rect(G, 28, 14, 36, 14, 'w'); G[13][37] = 'W';
    if (stage >= 1) rect(G, 28, 12, 35, 12, 'E');            // hot edge-line
    G[15][24] = 'G';
  } else {
    seg(G, 18 + co, 14, 21, 16, '3', 2);
    G[18][21] = 'G';
    seg(G, 22, 17, 23, 16, 'M', 1);
    rect(G, 22, 15, 23, 16, 'M');
    G[14][23] = 'G'; G[15][24] = 'G'; G[16][25] = 'G'; G[16][23] = 'G'; G[14][25] = 'G';
    for (let i = 0; i < 10; i++){
      const bx = 25 + i, by = 13 - i;
      if (bx < 38 && by >= 0){ G[by][bx] = 'W'; if (by + 1 < 36) G[by + 1][bx] = 'w'; }
    }
    if (stage >= 1) for (let i = 0; i < 8; i++){ const bx = 25 + i, by = 12 - i; if (bx < 38 && by >= 0 && G[by][bx] === '.') G[by][bx] = 'E'; }
  }
  texture(G);
  return outline(G).map(r => r.join(''));
}
//----------------------------------------------------------------------
// ENEMIES
//----------------------------------------------------------------------
function buildHound(frame){ // frame 0/1 run, 2 windup -- big ash-grey farm dog, stands tall
  const G = newGrid(30, 20);
  const c = frame === 2 ? 3 : 0;
  seg(G, 3, 5 + c, 0, 1 + c, 'l', 2);                       // tail raised
  seg(G, 4, 6 + c, 17, 5 + c, 'L', 5);                      // deep chest, high shoulders
  rect(G, 4, 4 + c, 16, 5 + c, 'M');                        // pale back ridge
  rect(G, 6, 10 + c, 15, 10 + c, 'l');                      // belly shadow
  rect(G, 16, 2 + c, 21, 7 + c, 'L');                       // neck + head held high
  rect(G, 16, 2 + c, 21, 3 + c, 'M');
  rect(G, 20, 4 + c, 26, 5 + c, 'L');                       // muzzle
  rect(G, 20, 7 + c, 25, 7 + c, 'l');                       // lower jaw, open
  G[6 + c][22] = 'W';                                       // bared teeth
  G[4 + c][21] = 'X';                                       // eye stays dark
  rect(G, 16, 0 + c, 17, 2 + c, 'l');                       // ear
  if (frame === 1){                                         // stride gathered
    seg(G, 6, 11, 9, 15, 'l', 2); seg(G, 9, 15, 8, 18, 'L', 2); rect(G, 7, 18, 10, 19, 'l');
    seg(G, 13, 11, 15, 15, 'L', 2); seg(G, 15, 15, 13, 18, 'l', 2); rect(G, 12, 18, 15, 19, 'l');
  } else {                                                  // stride extended / crouch
    seg(G, 6, 11 + c, 4, 15 + c, 'l', 2); seg(G, 4, 15 + c, 3, 18, 'L', 2); rect(G, 2, 18, 5, 19, 'l');
    seg(G, 9, 11 + c, 10, 15 + c, 'L', 2); seg(G, 10, 15 + c, 10, 18, 'l', 2); rect(G, 9, 18, 12, 19, 'l');
    seg(G, 14, 11 + c, 16, 15 + c, 'l', 2); seg(G, 16, 15 + c, 17, 18, 'L', 2); rect(G, 16, 18, 19, 19, 'l');
  }
  texture(G); return outline(G).map(r => r.join(''));
}
function buildImp(frame){ // ash imp: small erratic hopper. 0 crouch, 1 mid-leap
  const G = newGrid(14, 13);
  if (frame){
    rect(G, 4, 2, 9, 8, 'L'); rect(G, 4, 2, 9, 3, 'M');
    seg(G, 4, 8, 1, 11, 'l', 2); seg(G, 9, 8, 12, 11, 'l', 2);   // legs spread
    seg(G, 3, 4, 0, 2, 'l', 1); seg(G, 10, 4, 13, 2, 'l', 1);    // arms flung up
  } else {
    rect(G, 3, 5, 10, 11, 'L'); rect(G, 3, 5, 10, 6, 'M');
    rect(G, 3, 11, 10, 12, 'l');
    seg(G, 2, 8, 1, 11, 'l', 2); seg(G, 11, 8, 12, 11, 'l', 2);
  }
  const hy = frame ? 2 : 5;
  G[hy - 1][4] = 'l'; G[hy - 1][9] = 'l';                        // horn nubs
  G[hy + 1][5] = 'X'; G[hy + 1][8] = 'X';                        // eyes, dark
  texture(G); return outline(G).map(r => r.join(''));
}
function buildCultist(pose){ // ember cultist: 2-hit robed lobber. walk1/walk2/raise
  const G = newGrid(20, 30);
  rect(G, 6, 0, 13, 7, 'R'); rect(G, 7, 0, 12, 1, 'Q');
  rect(G, 8, 4, 11, 6, 'O');                                     // hood cavity, always dark
  for (let y = 8; y <= 25; y++){
    const w = 3 + Math.round((y - 8) * 0.22);
    rect(G, 10 - w, y, 9 + w, y, 'R');
    G[y][10 - w] = 'r';
  }
  rect(G, 4, 25, 15, 27, 'r');
  G[12][9] = 'O'; G[12][10] = 'O'; G[13][8] = 'O'; G[13][11] = 'O'; // soot sigil: crossed-out hearth
  if (pose === 'raise'){
    seg(G, 5, 10, 2, 4, 'R', 2); seg(G, 14, 10, 17, 4, 'R', 2);
    rect(G, 1, 2, 3, 4, 's'); rect(G, 16, 2, 18, 4, 's');        // ashen hands offered up
  } else {
    seg(G, 5, 10, 3, 16, 'R', 2); seg(G, 14, 10, 16, 16, 'R', 2);
  }
  if (pose === 'walk2'){ rect(G, 6, 28, 9, 29, 'l'); rect(G, 11, 28, 14, 29, 'l'); }
  else { rect(G, 5, 28, 8, 29, 'l'); rect(G, 12, 28, 15, 29, 'l'); }
  texture(G); return outline(G).map(r => r.join(''));
}
function buildLevy(frame){ // bone levy, 1-hit fodder
  const G = newGrid(28, 30);
  rect(G, 8, 1, 13, 6, '4'); G[3][9] = 'O'; G[3][12] = 'O'; rect(G, 6, 0, 13, 1, '2');
  rect(G, 9, 6, 12, 7, '3'); G[7][10] = 'O';
  rect(G, 10, 8, 11, 9, '4');
  rect(G, 6, 10, 15, 11, 'L'); rect(G, 5, 10, 8, 13, 'M');
  for (let y = 12; y <= 17; y++){ rect(G, 8, y, 13, y, y % 2 ? '4' : '3'); }
  rect(G, 10, 12, 11, 17, '4');
  rect(G, 9, 18, 12, 20, 'L'); G[19][10] = 'G';
  if (frame){
    seg(G, 9, 21, 12, 25, '4', 2); seg(G, 12, 26, 13, 28, '3', 2); rect(G, 11, 28, 15, 29, 'L');
    seg(G, 12, 21, 8, 25, '4', 2); seg(G, 8, 26, 7, 28, '3', 2); rect(G, 5, 28, 9, 29, 'L');
  } else {
    seg(G, 9, 21, 8, 25, '4', 2); seg(G, 8, 26, 7, 28, '3', 2); rect(G, 5, 28, 9, 29, 'L');
    seg(G, 12, 21, 13, 25, '4', 2); seg(G, 13, 26, 14, 28, '3', 2); rect(G, 12, 28, 16, 29, 'L');
  }
  seg(G, 14, 12, 18, 15, '4', 2);
  rect(G, 18, 15, 19, 16, 'L');
  rect(G, 20, 13, 20, 17, 'G');
  for (let i = 0; i < 7; i++){ const bx = 21 + i, by = 14 - i; if (bx < 28 && by >= 0){ G[by][bx] = 'W'; if (i % 3 !== 2 && by + 1 < 30) G[by + 1][bx] = 'w'; } }
  seg(G, 7, 12, 4, 16, '4', 2); rect(G, 3, 15, 4, 17, 'L');
  return outline(G).map(r => r.join(''));
}
function buildBrigand(pose){ // 3-hit heavy: walk1/walk2/raise/swing
  const G = newGrid(34, 32);
  rect(G, 10, 1, 17, 7, '2'); rect(G, 11, 0, 16, 0, '3');
  rect(G, 13, 4, 17, 4, '1');
  seg(G, 10, 2, 7, 0, 'G', 2); seg(G, 17, 2, 20, 0, 'G', 2);
  for (let y = 8; y <= 10; y++) for (let x = 7; x <= 20; x++) G[y][x] = hash(x, y) > 0.55 ? 'M' : 'l';
  rect(G, 8, 11, 19, 19, 'L'); rect(G, 8, 11, 8, 19, 'l'); rect(G, 18, 11, 19, 19, 'M');
  seg(G, 8, 11, 19, 18, 'R', 2);
  rect(G, 8, 19, 19, 21, 'l'); G[20][11] = 'G'; G[20][15] = 'G';
  if (pose === 'walk2'){
    seg(G, 11, 22, 13, 26, 'l', 3); seg(G, 13, 27, 14, 30, 'L', 3); rect(G, 12, 30, 18, 31, 'l');
    seg(G, 15, 22, 11, 26, 'L', 3); seg(G, 11, 27, 10, 30, 'M', 3); rect(G, 8, 30, 14, 31, 'l');
  } else {
    seg(G, 11, 22, 9, 26, 'l', 3); seg(G, 9, 27, 8, 30, 'L', 3); rect(G, 6, 30, 12, 31, 'l');
    seg(G, 15, 22, 17, 26, 'L', 3); seg(G, 17, 27, 17, 30, 'M', 3); rect(G, 15, 30, 21, 31, 'l');
  }
  if (pose === 'raise'){        // axe overhead -- the telegraph
    seg(G, 17, 12, 21, 6, 'M', 2); rect(G, 20, 4, 22, 6, 'M');
    seg(G, 22, 5, 23, -2, 'l', 2);
    rect(G, 19, 0, 27, 4, '2'); rect(G, 26, 0, 27, 4, '3'); rect(G, 28, 0, 28, 3, 'W');
  } else if (pose === 'swing'){ // axe slammed down in front
    seg(G, 17, 13, 24, 16, 'M', 2); rect(G, 24, 15, 26, 17, 'M');
    seg(G, 26, 16, 29, 22, 'l', 2);
    rect(G, 26, 22, 33, 27, '2'); rect(G, 26, 26, 33, 27, '3'); rect(G, 26, 28, 33, 28, 'W');
  } else {                      // shouldered
    seg(G, 22, 3, 18, 20, 'l', 2);
    rect(G, 21, 1, 27, 6, '2'); rect(G, 26, 1, 27, 6, '3');
    rect(G, 28, 2, 28, 5, 'W');
    seg(G, 16, 13, 20, 17, 'M', 2); rect(G, 19, 17, 21, 19, 'M');
  }
  seg(G, 9, 12, 6, 16, '2', 2); rect(G, 5, 15, 6, 17, 'M');
  texture(G); return outline(G).map(r => r.join(''));
}
function buildWraith(frame){ // background tease in Act I
  const G = newGrid(24, 14);
  const up = frame ? -1 : 1;
  for (let x = 1; x <= 8; x++){ const t = 3 + Math.floor((8 - x) * 0.6 * up + (up < 0 ? 5 : 0)); rect(G, x, t, x, t + 3 + (x % 3 ? 1 : 0), 'r'); if (G[t]) G[t][x] = 'L'; }
  for (let x = 15; x <= 22; x++){ const t = 3 + Math.floor((x - 15) * 0.6 * up + (up < 0 ? 5 : 0)); rect(G, x, t, x, t + 3 + (x % 3 ? 1 : 0), 'r'); if (G[t]) G[t][x] = 'L'; }
  rect(G, 9, 3, 14, 9, 'l'); rect(G, 10, 1, 13, 3, 'l');
  G[2][10] = 'M'; G[2][13] = 'M';
  G[4][10] = 'X'; G[4][12] = 'X';
  return outline(G).map(r => r.join(''));
}
// sprite cache
const CACHE = {};
function spr(kind, a, b){
  const key = kind + '|' + a + '|' + (b || 0);
  if (CACHE[key]) return CACHE[key];
  let img;
  if (kind === 'hero') img = px(STAGE_PAL[b], buildHero(a, b), 2);
  else if (kind === 'hound') img = px(HOUNDPAL, buildHound(a), 2);
  else if (kind === 'levy') img = px(BONE, buildLevy(a), 2);
  else if (kind === 'brigand') img = px(BRIGPAL, buildBrigand(a), 2);
  else if (kind === 'wraith') img = px(WRPAL, buildWraith(a), 2);
  else if (kind === 'imp') img = px(IMPPAL, buildImp(a), 2);
  else if (kind === 'cult') img = px(CULTPAL, buildCultist(a), 2);
  CACHE[key] = img;
  CACHE[key + '|white'] = tinted(img, '#ffffff');
  CACHE[key + '|ash'] = tinted(img, '#241a12');
  return img;
}
const sprWhite = (kind, a, b) => { spr(kind, a, b); return CACHE[kind + '|' + a + '|' + (b || 0) + '|white']; };

};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  AU.init();
  if (!keys[a]) keys[a + 'Hit'] = true;
  keys[a] = true;
  if (a === 'up' && !keys.jump){ keys.jumpHit = true; keys.jump = true; } // up doubles as jump
  if (a === 'mute') AU.music = !AU.music;
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  keys[a] = false;
  if (a === 'up') keys.jump = false;
});

  document.body.classList.add('touch');
  const bind = (id, act) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); AU.init();
      if (!keys[act]) keys[act + 'Hit'] = true; keys[act] = true; }, {passive:false});
    el.addEventListener('touchend', e => { e.preventDefault(); keys[act] = false; }, {passive:false});
  };
  bind('bL', 'left'); bind('bR', 'right'); bind('bA', 'jump'); bind('bB', 'atk');
  cvs.addEventListener('touchstart', () => { AU.init(); keys.startHit = true; });
}

const tileAt = (tx, ty) => (tx < 0 || tx >= LW) ? '#' : (ty < 0 || ty >= LH) ? '.' : grid[ty][tx];
const isSolid = (tx, ty) => { const t = tileAt(tx, ty); return t === '#' || t === '%'; };
function moveX(e, dx){
  e.x += dx;
  const t0 = Math.floor(e.y / TS), t1 = Math.floor((e.y + e.h - 1) / TS);
  if (dx > 0){
    const tx = Math.floor((e.x + e.w) / TS);
    for (let ty = t0; ty <= t1; ty++) if (isSolid(tx, ty)){ e.x = tx * TS - e.w - 0.01; e.vx = 0; return true; }
  } else if (dx < 0){
    const tx = Math.floor(e.x / TS);
    for (let ty = t0; ty <= t1; ty++) if (isSolid(tx, ty)){ e.x = (tx + 1) * TS + 0.01; e.vx = 0; return true; }
  }
  return false;
}
function moveY(e, dy){
  const prevBottom = e.y + e.h;
  e.y += dy;
  const c0 = Math.floor(e.x / TS), c1 = Math.floor((e.x + e.w - 1) / TS);
  if (dy > 0){
    const ty = Math.floor((e.y + e.h) / TS);
    for (let tx = c0; tx <= c1; tx++){
      const t = tileAt(tx, ty);
      if (t === '#' || t === '%' || (t === '=' && prevBottom <= ty * TS + 0.5)){
        e.y = ty * TS - e.h - 0.01; e.vy = 0; return 'floor';
      }
    }
  } else if (dy < 0){
    const ty = Math.floor(e.y / TS);
    for (let tx = c0; tx <= c1; tx++) if (isSolid(tx, ty)){ e.y = (ty + 1) * TS + 0.01; e.vy = 0; return 'ceil'; }
  }
  return null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function groundAhead(e){
  const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
  const ty = Math.floor((e.y + e.h + 4) / TS), tx = Math.floor(fx / TS);
  const t = tileAt(tx, ty);
  return t === '#' || t === '=';
}

const MAXP = 60;
function burst(x, y, color, n, spd, grav){
  n = Math.min(n, 16);
  for (let i = 0; i < n; i++){
    if (particles.length >= MAXP) particles.shift();
    particles.push({x, y, vx:(Math.random() - 0.5) * (spd || 4), vy:-Math.random() * 3.5 - 0.5,
      life: 22 + Math.random() * 18, color, size: 2 + Math.random() * 3, grav: grav !== undefined ? grav : 0.18});
  }
}
function sparkCone(x, y, dir, n){
  n = Math.min(n, 16);
  for (let i = 0; i < n; i++){
    if (particles.length >= MAXP) particles.shift();
    const a = (Math.random() - 0.5) * 1.05, sp = 4 + Math.random() * 3;
    particles.push({x, y, vx: Math.cos(a) * sp * dir, vy: Math.sin(a) * sp - 1,
      life: 20 + Math.random() * 15, color: Math.random() > 0.5 ? '#ffd75e' : '#ffb347', size: 2, grav: 0.22});
  }
}
function popup(x, y, txt, color, big){ popups.push({x, y, txt, color: color || '#e8d9b0', life: 45, big: !!big}); }
function toast(txt){ toasts.push({txt, t: 0}); }
function shake(n){ cam.shake = Math.min(8, Math.max(cam.shake, n)); }

function rollCrit(heavy){
  if (!hasSteel) return false;
  if (critSuppress > 0){ critSuppress--; critPity++; return false; }
  critPity++;
  const odds = heavy ? 12 : 20;
  if (critPity >= 24 || Math.random() < 1 / odds){
    critPity = 0; critSuppress = 3;
    return true;
  }
  return false;
}
function bankHit(){
  if (!hasCoal) return;
  if (embers >= maxEmbers){ AU.fizzle(); sparkCone(player.x + player.w / 2, player.y + 20, player.dir, 3); return; }
  if (++hitsBanked >= 5){ hitsBanked = 0; embers++; AU.emberUp(); }
}
function bankEmber(){ if (hasCoal && embers < maxEmbers) { embers++; AU.emberUp(); } }
function hurtEnemy(e, dmg, crit, fromX){
  e.hp -= dmg;
  e.flashW = crit ? 2 : 1;
  if (e.hp > 0){
    e.flinch = 8;
    hitstop = crit ? 9 : 4;
    AU.hit(0); if (crit) AU.crit();
    if (crit){ popup(e.x + e.w / 2, e.y - 14, 'THE BLADE CATCHES', '#ffd75e', true); sparkCone(e.x + e.w / 2, e.y + e.h / 2, player.x < e.x ? 1 : -1, 14); shake(2); }
    else burst(e.x + e.w / 2, e.y + e.h / 2, '#c9b89a', 5, 3);
    return;
  }
  // kill
  e.dead = true; killCount++;
  if (!loreSeen[e.kind]){                     // bestiary line, first kill of each kind
    loreSeen[e.kind] = true;
    const LORE = {L:'The kingdom’s levy still musters.', H:'The dogs stayed. The fire kept them.',
      B:'Sellswords, paid in dead men’s coin.', a:'Something small learned to love the ash.',
      W:'It rose as smoke and never came down.', C:'They tithe to a nameless warmth.'};
    toast(LORE[e.kind]);
  }
  chain = (frame - lastKillF < 90) ? chain + 1 : 1;
  lastKillF = frame; bestChain = Math.max(bestChain, chain);
  const basePts = {L:20, H:30, B:60, a:40, W:45, C:50}[e.kind]; // small and airborne pay best
  let pts = basePts * (crit ? 2 : 1);
  if (player && !player.onGround && !player.dead){
    pts = Math.round(pts * 1.5);
    popup(e.x + e.w / 2, e.y - 54, 'AERIAL!', '#8ae2ff');
  }
  xp += pts;
  hitstop = crit ? 9 : 4;
  AU.kill(chain - 1); if (crit) AU.crit();
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  popup(cx, e.y - 6, '+' + pts + ' XP', '#c8a05c');
  if (crit) popup(cx, e.y - 22, 'THE BLADE CATCHES', '#ffd75e', true);
  if (chain === 2) popup(cx, e.y - 38, 'DOUBLE!', '#ffb347', true);
  else if (chain === 3){ popup(cx, e.y - 38, 'TRIPLE!', '#ffb347', true); bankEmber(); }
  else if (chain >= 4) popup(cx, e.y - 38, 'RAMPAGE!', '#ff7a3c', true);
  if (crit) shake(2);
  // corpse launch
  const fr = e.kind === 'B' ? (e.st === 'raise' ? 'raise' : 'walk1') : e.kind === 'C' ? 'walk1' : e.kind === 'a' ? 1 : 0;
  corpses.push({kind: e.kind, fr, x: e.x, y: e.y, vx: (cx < fromX ? -3.5 : 3.5), vy: -5,
    rot: 0, vr: (cx < fromX ? -0.2 : 0.2), t: 0, ash: crit, dir: e.dir});
  burst(cx, cy, crit ? '#241a12' : '#c9b89a', crit ? 14 : 8, 4);
}
function swordBox(){
  const p = player;
  if (p.atk < 4 || p.atk > 11) return null;
  if (p.atkUp) return {x: p.x - 8, y: p.y - 34, w: p.w + 16, h: 44};
  return {x: p.dir > 0 ? p.x + p.w - 2 : p.x - 34, y: p.y + 8, w: 36, h: 34}; // arc sweeps past horizontal, low enough for hounds
}
function hurtPlayer(fromX, dmg){
  const p = player;
  if (p.inv > 0 || p.dead || transform) return;
  p.hp -= (dmg || 1);
  AU.hurt(); shake(3);
  p.redFlash = 2;
  if (p.hp <= 0){ killPlayer(); return; }
  p.inv = 90;
  p.vy = -5;
  p.vx = (p.x + p.w / 2 < fromX ? -1 : 1) * 4.5;
}
function killPlayer(){
  const p = player;
  if (p.dead) return;
  p.dead = true; p.deadT = 0; p.vy = -8;
  deaths++; AU.die();
  toast('One coal spent.');
}

function updatePlayer(){
  const p = player;
  if (p.dead){
    p.vy += 0.4; p.y += p.vy; p.deadT++;
    if (p.deadT > 80){
      lives--;
      if (lives <= 0){
        state = 'gameover';
        saveBest();
      } else resetLevel(true);
    }
    return;
  }
  if (p.ceremony > 0){ // lantern lift at a tended fire
    p.ceremony--; p.vx = 0;
    p.vy = Math.min(p.vy + 0.55, 13);
    moveY(p, p.vy);
    return;
  }
  const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const target = want * 4.4;
  p.vx += (target - p.vx) * (p.onGround ? 0.25 : 0.12);
  if (Math.abs(p.vx) < 0.05) p.vx = 0;
  if (want) p.dir = want;
  p.coyote = p.onGround ? 7 : Math.max(0, p.coyote - 1);
  p.jumpBuf = keys.jumpHit ? 8 : Math.max(0, p.jumpBuf - 1);
  if (p.jumpBuf > 0 && p.coyote > 0){
    p.vy = -11.8; p.coyote = 0; p.jumpBuf = 0;
    burst(p.x + 11, p.y + p.h, '#8a7a5c', 4, 3);
    AU.noise(0.06, 0.06, 300);
  }
  if (!keys.jump && p.vy < -4) p.vy *= 0.82;
  if (p.atkCd > 0) p.atkCd--;
  if (p.atk > 0) p.atk--;
  if (p.cast > 0) p.cast--;
  if (keys.atkHit && p.atkCd === 0 && p.cast === 0){
    if (!p.onGround && keys.down && !p.plunge){        // PLUNGING STRIKE: blade-down dive, pogo off foes
      p.plunge = true; p.hitDone = {}; AU.slash();
    } else if (!p.plunge){
      p.atk = 14; p.atkCd = 20; p.hitDone = {}; AU.slash();
      if (p.onGround && (keys.jump || keys.up)){       // RISING STRIKE: leap with an upward cut
        p.atkUp = true;
        p.vy = -8.5; p.coyote = 0; burst(p.x + 11, p.y + p.h, '#8a7a5c', 3, 3);
      } else if (!p.onGround && keys.up){              // SKYWARD CUT: upward slash mid-jump, foes above
        p.atkUp = true;
        p.vy = Math.min(p.vy, -1.5);                   // brief lift so the cut connects
      } else p.atkUp = false;
    }
  }
  if (p.atk === 0) p.atkUp = false;
  // fireball (Act II+; engine-ready)
  if (keys.castHit && hasCoal && p.cast === 0 && p.atk === 0 && p.onGround){
    if (embers > 0){
      p.cast = 16;
      embers--;
    } else { popup(p.x + p.w / 2, p.y - 10, 'BRAND RUNS COLD', '#8a95a8'); AU.fizzle(); }
  }
  if (p.cast === 10){ // release frame
    fireballs.push({x: p.x + (p.dir > 0 ? p.w + 6 : -18), y: p.y + 18, vx: 5.0 * p.dir, vy: -0.4, w: 12, h: 12, t: 0});
    AU.fireball(); shake(1);
  }
  p.vy = Math.min(p.vy + 0.55, 13);
  if (p.plunge){
    p.vy = Math.min(p.vy + 1.0, 12);
    p.vx *= 0.92;
    if (p.vy > 0 && p.prevVy <= 0) p.hitDone = {};     // new dive after a pogo bounce: fresh targets
  }
  p.prevVy = p.vy;
  moveX(p, p.vx);
  const wasAir = !p.onGround;
  p.onGround = moveY(p, p.vy) === 'floor';
  if (p.onGround && wasAir && p.vy >= 0){
    burst(p.x + 11, p.y + p.h, '#8a7a5c', p.plunge ? 8 : 3, p.plunge ? 4 : 3);
    if (p.plunge){ p.plunge = false; AU.noise(0.08, 0.1, 350); }
  }
  if (p.inv > 0) p.inv--;
  if (p.redFlash > 0) p.redFlash--;
  p.animT += Math.abs(p.vx) * 0.055 + 0.02;
  // running footfall dust + stage ember trail
  if (p.onGround && Math.abs(p.vx) > 3 && frame % 8 === 0) burst(p.x + 11, p.y + p.h - 2, '#6b5a44', 2, 1.5);
  if (stage >= 1 && frame % 10 === 0 && Math.abs(p.vx) > 1)
    burst(p.x + p.w / 2 - p.dir * 8, p.y + 16, '#e88a34', 1, 1, -0.02);
  if (p.y > LH * TS + 80){ p.hp = 0; killPlayer(); }
  // checkpoints
  for (const c of checkpoints) if (!c.lit && Math.abs(p.x - c.x) < 52 && Math.abs(p.y + p.h - (c.y + TS)) < 150){
    c.lit = true; p.hp = maxHearts; embers = maxEmbers * (hasCoal ? 1 : 0); hitsBanked = 0;
    p.ceremony = 50;
    AU.tended(); toast('TENDED.');
    burst(c.x + 16, c.y + 8, '#ffb347', 10, 2, 0.02);
  }
  // secret braziers: strike them alight
  const sb2 = swordBox();
  if (sb2) for (const b of braziers){
    if (!b.lit && overlap(sb2, {x: b.x - 4, y: b.y - 6, w: 40, h: 44})){
      b.lit = true; secrets++; xp += 25;
      AU.tended(); toast('A hidden brazier burns again.');
      burst(b.x + 16, b.y + 8, '#ffb347', 12, 3, 0.02);
      popup(b.x + 16, b.y - 12, 'SECRET  ' + secrets + '/' + braziers.length, '#8ae2ff', true);
    }
  }
  // collapsing floor: standing on '%' wakes it
  if (p.onGround){
    const fy = Math.floor((p.y + p.h + 2) / TS);
    for (let tx = Math.floor(p.x / TS); tx <= Math.floor((p.x + p.w - 1) / TS); tx++){
      if (tileAt(tx, fy) === '%' && !crumbling.some(cr => cr.tx === tx && cr.ty === fy)){
        crumbling.push({tx, ty: fy, t: 0});
        AU.noise(0.08, 0.08, 260);
      }
    }
  }
  // swinging censers: kept fire on a chain, still hungry
  for (const cn of censers){
    const a = Math.sin(frame * 0.024 + cn.phase) * 1.05;
    const bx = cn.x + Math.sin(a) * cn.len, by = cn.y + Math.cos(a) * cn.len;
    if (!p.dead && overlap({x: bx - 13, y: by - 13, w: 26, h: 26}, p)) hurtPlayer(bx, 1);
  }
  // story beats fire once, where the ground remembers
  for (const tr of triggers){
    if (!tr.fired && p.x > tr.col * TS){
      tr.fired = true;
      const cs = tr.cards.map(cd => ({...cd, t: 0, next: 'play'}));
      card = cs.shift(); cardQueue.push(...cs);
      state = 'card';
    }
  }
  // act end
  if (p.x > ACTS[act].endCol * TS && state === 'play'){
    state = 'grade'; computeGrade(); AU.stamp(); saveBest();
  }
}
function updateCrumble(){
  for (let i = crumbling.length - 1; i >= 0; i--){
    const cr = crumbling[i];
    cr.t++;
    if (cr.t === 20){
      grid[cr.ty][cr.tx] = '.';
      crumbled.push({tx: cr.tx, ty: cr.ty});
      burst(cr.tx * TS + 16, cr.ty * TS + 8, '#4a5160', 8, 3);
      AU.noise(0.12, 0.1, 200);
      crumbling.splice(i, 1);
    }
  }
}
function updateEnemies(){
  const p = player, sb = (!p.dead && !transform) ? swordBox() : null;
  for (const e of enemies){
    if (e.dead) continue;
    e.t++;
    if (e.flinch > 0){ e.flinch--; }
    else if (e.kind === 'L'){
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++;
      if (e.st === 'patrol'){
        if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
        const dx = p.x - e.x;
        if (!p.dead && Math.abs(dx) < 70 && Math.sign(dx) === e.dir && Math.abs((p.y + p.h) - (e.y + e.h)) < 40){
          e.st = 'poise'; e.stT = 0; e.vx = 0;              // telegraph: pause and blink
        }
      } else if (e.st === 'poise'){
        if (e.stT > 16){ e.st = 'lunge'; e.stT = 0; e.dir = p.x > e.x ? 1 : -1; AU.noise(0.05, 0.06, 800); }
      } else if (e.st === 'lunge'){
        moveX(e, 2.4 * e.spd * e.dir);
        if (e.stT > 14 || (onG && !groundAhead(e))){ e.st = 'cool'; e.stT = 0; }
      } else { // cool
        if (e.stT > 30){ e.st = 'patrol'; e.vx = 0.9 * e.spd * e.dir; }
      }
    } else if (e.kind === 'H'){
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++;
      if (e.st === 'patrol'){
        if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
        const dx = p.x - e.x, sameLevel = Math.abs((p.y + p.h) - (e.y + e.h)) < 48;
        if (!p.dead && sameLevel && Math.abs(dx) < 260 && Math.sign(dx) === e.dir){
          e.st = 'windup'; e.stT = 0; e.vx = 0; AU.growl();
        }
      } else if (e.st === 'windup'){
        if (e.stT > 24){
          e.st = 'charge'; e.stT = 0; e.dir = p.x > e.x ? 1 : -1;
          if (onG) e.vy = -3.2;                        // springs off its haunches
        }
      } else if (e.st === 'charge'){
        const hitWall = moveX(e, 4.0 * e.spd * e.dir);
        if (hitWall || (onG && !groundAhead(e)) || e.stT > 70){ e.st = 'tired'; e.stT = 0; }
      } else { // tired
        if (e.stT > 36){ e.st = 'patrol'; e.vx = 1.1 * e.spd * e.dir; }
      }
    } else if (e.kind === 'a'){                        // ash imp: waits, then leaps at you, erratic
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++;
      if (onG){
        e.vx = 0;
        if (e.st !== 'wait'){ e.st = 'wait'; e.stT = 0; }
        const dx = p.x - e.x;
        if (!p.dead && e.stT > e.pause && Math.abs(dx) < 250){
          e.dir = dx > 0 ? 1 : -1;
          const high = hash(e.x + e.t, e.stT) > 0.6;
          e.vy = high ? -9.5 : -7;
          e.vx = (1.8 + hash(e.stT, e.x + e.t) * 1.8) * e.dir;
          e.st = 'leap'; e.stT = 0;
          e.pause = 14 + hash(e.x * 3 + e.t, e.stT) * 34;
          AU.noise(0.04, 0.05, 1200);
        }
      } else moveX(e, e.vx);
    } else if (e.kind === 'W'){                        // cinder wraith: floats, then swoops
      e.stT++;
      if (e.st === 'float'){
        e.x += 0.3 * e.spd * e.dir;
        e.y = e.baseY + Math.sin(e.t * 0.045) * 14;
        if (e.t % 240 === 0) e.dir *= -1;
        const dx = (p.x + p.w / 2) - (e.x + e.w / 2);
        if (!p.dead && Math.abs(dx) < 230 && p.y > e.y - 20){
          e.st = 'dive'; e.stT = 0; e.dir = dx > 0 ? 1 : -1;
          e.dvx = dx / 34; e.dvy = Math.max(1, (p.y + 10 - e.y) / 34);
          AU.noise(0.15, 0.05, 2200);
        }
      } else if (e.st === 'dive'){
        e.x += e.dvx; e.y += e.dvy;
        if (e.stT > 34){ e.st = 'rise'; e.stT = 0; }
      } else { // rise
        e.y -= 2.2; e.x += e.dvx * 0.5;
        if (e.stT > 40){ e.st = 'float'; e.baseY = e.y; }
      }
    } else if (e.kind === 'C'){                        // ember cultist: 2-hit lobber
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++; if (e.cd > 0) e.cd--;
      const cdx = (p.x + p.w / 2) - (e.x + e.w / 2);
      if (e.st === 'walk'){
        if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
        if (!p.dead && e.cd === 0 && Math.abs(cdx) < 300 && Math.abs(cdx) > 40){
          e.st = 'raise'; e.stT = 0; e.dir = cdx > 0 ? 1 : -1; e.vx = 0;
          AU.noise(0.08, 0.05, 600);
        }
      } else if (e.st === 'raise'){
        if (e.stT > 26){
          shots.push({type:'ember', x: e.x + e.w / 2, y: e.y + 4, w:10, h:10,
            vx: Math.max(-4, Math.min(4, cdx / 55)), vy: -6.4, t:0});
          AU.tone(90, 55, 0.18, 'sawtooth', 0.08); AU.noise(0.1, 0.06, 500);
          e.st = 'cool'; e.stT = 0; e.cd = 150;
        }
      } else if (e.stT > 24){ e.st = 'walk'; e.vx = 0.4 * e.spd * e.dir; }
    } else if (e.kind === 'B'){
      e.vy = Math.min(e.vy + 0.55, 13);
      const onG = moveY(e, e.vy) === 'floor';
      e.stT++; if (e.cd > 0) e.cd--;
      if (e.st === 'walk'){
        if (moveX(e, e.vx) || (onG && !groundAhead(e))){ e.dir *= -1; e.vx = Math.abs(e.vx) * e.dir; }
        const dx = p.x - (e.x + e.w / 2);
        const level = Math.abs((p.y + p.h) - (e.y + e.h)) < 40;
        if (!p.dead && Math.abs(dx) < 92 && level){
          e.st = 'raise'; e.stT = 0; e.dir = dx > 0 ? 1 : -1; AU.clang();
        } else if (!p.dead && e.cd === 0 && level && Math.abs(dx) > 130 && Math.abs(dx) < 280){
          e.st = 'hurl'; e.stT = 0; e.dir = dx > 0 ? 1 : -1; e.vx = 0; AU.clang(); // an axe for the road
        }
      } else if (e.st === 'hurl'){
        if (e.stT > 26){
          shots.push({type:'axe', x: e.x + (e.dir > 0 ? e.w : -12), y: e.y + 6, w:14, h:14,
            vx: 2.9 * e.dir, vy: -7.2, t:0});
          AU.noise(0.08, 0.1, 900);
          e.st = 'recover'; e.stT = 0; e.cd = 280;
        }
      } else if (e.st === 'raise'){
        if (e.stT > 30){ e.st = 'swing'; e.stT = 0; AU.noise(0.1, 0.12, 400); shake(2); }
      } else if (e.st === 'swing'){
        if (e.stT < 12 && !p.dead){
          const hb = {x: e.dir > 0 ? e.x + e.w : e.x - 44, y: e.y + 16, w: 44, h: 44};
          if (overlap(hb, p)) hurtPlayer(e.x + e.w / 2, 1);
        }
        if (e.stT > 12){ e.st = 'recover'; e.stT = 0; }
      } else {
        if (e.stT > 40){ e.st = 'walk'; e.vx = 0.5 * e.spd * e.dir; }
      }
    }
    if (e.flashW > 0) e.flashW--;
    if (p.dead || transform) continue;
    // plunging strike: bounce off the kill, higher than a jump
    if (p.plunge && p.vy > 0){
      const pb = {x: p.x - 4, y: p.y + p.h - 8, w: p.w + 8, h: 30};
      if (!p.hitDone['p' + enemies.indexOf(e)] && overlap(pb, e)){
        p.hitDone['p' + enemies.indexOf(e)] = true;
        const crit = rollCrit(e.kind === 'B');
        bankHit();
        hurtEnemy(e, crit ? 2 : 1, crit, p.x + p.w / 2);
        p.vy = -10.8;
        if (!keys.down) p.plunge = false;               // release ↓ to dismount the pogo
        continue;
      }
    }
    // sword
    if (sb && !p.hitDone['e' + enemies.indexOf(e)] && overlap(sb, e)){
      p.hitDone['e' + enemies.indexOf(e)] = true;
      const crit = rollCrit(e.kind === 'B');
      bankHit();
      hurtEnemy(e, crit ? 2 : 1, crit, p.x + p.w / 2);
      continue;
    }
    // stomp / touch
    if (overlap(p, e)){
      if (p.vy > 1 && p.y + p.h - e.y < 20){
        p.vy = -8.5;
        hurtEnemy(e, e.kind === 'B' ? 1 : 1, false, p.x + p.w / 2);
        if (e.kind === 'B' && !e.dead){ e.flinch = 14; }
      } else if (!(e.kind === 'B' && (e.st === 'raise'))){
        hurtPlayer(e.x + e.w / 2, 1);
      }
    }
  }
  // fireballs
  for (let i = fireballs.length - 1; i >= 0; i--){
    const f = fireballs[i];
    f.t++; f.vy += 0.06; f.x += f.vx; f.y += f.vy;
    burst(f.x + 6, f.y + 6, '#ffb347', 1, 1, 0);
    const tx = Math.floor((f.x + 6) / TS), ty = Math.floor((f.y + 6) / TS);
    let dead = isSolid(tx, ty) || f.t > 160;
    for (const b of braziers){ // thrown fire lights what the sword can't reach
      if (!b.lit && overlap(f, {x: b.x - 4, y: b.y - 6, w: 40, h: 44})){
        b.lit = true; secrets++; xp += 25; dead = true;
        AU.tended(); toast('A hidden brazier burns again.');
        burst(b.x + 16, b.y + 8, '#ffb347', 12, 3, 0.02);
        popup(b.x + 16, b.y - 12, 'SECRET  ' + secrets + '/' + braziers.length, '#8ae2ff', true);
      }
    }
    for (const e of enemies){
      if (e.dead || !overlap(f, e)) continue;
      hurtEnemy(e, 2, false, f.x);
      hitstop = Math.max(hitstop, 5);
      if (e.kind === 'B'){ dead = true; break; } // stops on heavies, pierces fodder
    }
    if (dead){ burst(f.x + 6, f.y + 6, '#ff7a3c', 10, 3); fireballs.splice(i, 1); }
  }
  // enemy shots: hurled axes arc through everything; ember lobs burst on stone
  for (let i = shots.length - 1; i >= 0; i--){
    const s = shots[i];
    s.t++;
    s.vy += s.type === 'axe' ? 0.28 : 0.14;
    s.x += s.vx; s.y += s.vy;
    if (s.type === 'ember' && s.t % 3 === 0) burst(s.x + 4, s.y + 4, '#c96a2e', 1, 0.6, 0);
    if (sb && overlap(sb, s)){                               // bat it out of the air
      AU.clang(); burst(s.x + 5, s.y + 5, s.type === 'axe' ? '#8f8a7a' : '#ff7a3c', 6, 3);
      popup(s.x + 5, s.y - 8, 'PARRIED', '#8ae2ff');
      shots.splice(i, 1); continue;
    }
    if (!p.dead && !transform && overlap(s, p)){
      hurtPlayer(s.x, 1); shots.splice(i, 1); continue;
    }
    const stx = Math.floor((s.x + s.w / 2) / TS), sty = Math.floor((s.y + s.h) / TS);
    if (s.type === 'ember' && isSolid(stx, sty)){
      burst(s.x + 5, s.y + 5, '#ff7a3c', 8, 3); shots.splice(i, 1); continue;
    }
    if (s.y > LH * TS + 80 || s.t > 300) shots.splice(i, 1);
  }
}
function updateItems(){
  const p = player;
  for (const it of items){
    if (it.taken) continue;
    it.t += 0.1;
    const box = {x: it.x + 4, y: it.y + 2 + Math.sin(it.t) * 3, w: 24, h: 26};
    if (!p.dead && overlap(p, box)){
      it.taken = true;
      if (it.kind === 'c'){
        coins++; xp += 5; AU.coin(); burst(it.x + 16, it.y + 14, '#c8a05c', 5, 2.5);
        if (!firstCoin){ firstCoin = true; toast('A dead man’s coin. Carry it home.'); }
      }
      else if (it.kind === 'e'){
        if (p.hp < maxHearts){ p.hp++; }
        toast('An ember. It warms what it can.');
        AU.emberUp(); burst(it.x + 16, it.y + 14, '#ffb347', 8, 2);
      }

function updateFx(){
  for (let i = particles.length - 1; i >= 0; i--){
    const q = particles[i];
    q.x += q.vx; q.y += q.vy; q.vy += q.grav; q.life--;
    if (q.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--){
    const q = popups[i]; q.y -= q.big ? 1.0 : 0.7; q.life--;
    if (q.life <= 0) popups.splice(i, 1);
  }
  for (let i = corpses.length - 1; i >= 0; i--){
    const c = corpses[i];
    c.t++; c.x += c.vx; c.y += c.vy; c.vy += 0.35; c.rot += c.vr;
    if (c.y > LH * TS + 100 || c.t > 120) corpses.splice(i, 1);
  }
  for (let i = toasts.length - 1; i >= 0; i--){
    toasts[i].t++;
    if (toasts[i].t > 150) toasts.splice(i, 1);
  }
}

function maybeLevelUp(){

function updateTransform(){
  if (!transform) return;
  transform.t++;
  const t = transform.t;
  timeScale = t < 20 ? 1 - (t / 20) * 0.75 : t < 65 ? 0.25 : 1;
  if (t < 65 && t % 2 === 0){
    // converging embers
    const a = hash(t, 3) * 6.283, r = 130 + hash(t, 7) * 60;
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    if (particles.length >= MAXP) particles.shift();
    particles.push({x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r,
      vx: -Math.cos(a) * r / 22, vy: -Math.sin(a) * r / 22, life: 22, color: '#ffb347', size: 3, grav: 0});
  }
  if (t === 65){
    stage++;
    hitstop = 6; shake(4);
    toast(stage === 1 ? 'SPARK. THE EMBER STIRS.' : stage === 2 ? 'KINDLED. THE VISOR BRIGHTENS.' : 'ABLAZE. HOW BRIGHTLY YOU BURN.');
    // shockwave: kill fodder, stagger heavies
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    for (const e of enemies){
      if (e.dead) continue;
      const d = Math.hypot(e.x + e.w / 2 - cx, e.y + e.h / 2 - cy);

        if (e.kind === 'B'){ e.flinch = 40; burst(e.x + e.w / 2, e.y + 10, '#ffb347', 6, 3); }
        else hurtEnemy(e, 9, false, cx);
      }
    }
    burst(cx, cy, '#ffd75e', 16, 7, 0.02);
    transform.wave = 1;
  }
  if (transform.wave) transform.wave += 14;
  if (t > 85){ transform = null; timeScale = 1; }
}
function computeGrade(){
  const secs = playTime / 60;
  const killPct = killTotal ? killCount / killTotal : 1;
  let score = 0;
  score += deaths === 0 ? 3 : deaths === 1 ? 2 : deaths === 2 ? 1 : 0;
  score += secs < 260 ? 2 : secs < 400 ? 1 : 0;
  score += killPct >= 0.9 ? 2 : killPct >= 0.6 ? 1 : 0;
  score += bestChain >= 3 ? 1 : 0;
  score += secrets >= braziers.length ? 1 : 0;
  grade = {letter: score >= 8 ? 'S' : score >= 6 ? 'A' : score >= 4 ? 'B' : score >= 2 ? 'C' : 'D',
    secs, killPct, t: 0};
}

  try {
    if (xp > (best.xp || 0)) best.xp = xp;
    if (grade && (!best.grade || 'DCBAS'.indexOf(grade.letter) > 'DCBAS'.indexOf(best.grade))) best.grade = grade.letter;
    localStorage.setItem('emberward', JSON.stringify(best));

}

// three cloud families, told apart the way real sky is: height, shape, light.
function cirrus(seed){
  // high and ice-thin: wind-combed streaks, too far up to catch much fire
  const spanW = VW + 500;
  for (let i = 0; i < 5; i++){
    if (hash(seed, i) > 0.9) continue;
    const x = ((hash(seed + 1, i) * spanW - frame * 0.05 - cam.x * 0.02) % spanW + spanW) % spanW - 250;
    const y = VH * (0.05 + hash(seed + 2, i) * 0.11);
    const len = 130 + hash(seed + 3, i) * 220;
    ctx.strokeStyle = 'rgba(235,185,150,' + (0.05 + hash(seed + 4, i) * 0.05).toFixed(3) + ')';
    for (let s = 0; s < 3; s++){ // a few strands per streak, swept slightly upward
      ctx.lineWidth = s === 1 ? 2 : 1;
      ctx.beginPath();
      for (let t = 0; t <= len; t += 16){
        const yy = y + s * 3 + Math.sin(t * 0.02 + i * 2 + s) * 3 - t * 0.02;
        t ? ctx.lineTo(x + t, yy) : ctx.moveTo(x + t, yy);
      }
      ctx.stroke();
    }
  }
}
function cumulus(seed){
  // mid height: heaped lobed tops on a FLAT base; the base faces the fires
  const spanW = VW + 700;
  for (let m = 0; m < 3; m++){
    if (hash(seed + 9, m) > 0.88) continue;
    const mx = (((m / 3) * spanW + hash(seed, m) * 300 - frame * 0.14 - cam.x * 0.03) % spanW + spanW) % spanW - 350;
    if (mx < -300 || mx > VW + 300) continue;
    const baseY = VH * (0.24 + hash(seed + 1, m) * 0.13);
    const scale = 0.7 + hash(seed + 2, m) * 0.9;
    const lit = 0.4 + hash(seed + 3, m) * 0.6;
    const n = 4 + (hash(seed + 4, m) * 3 | 0);
    const wTot = n * 26 * scale;
    ctx.fillStyle = 'rgba(230,110,44,' + (0.32 * lit).toFixed(3) + ')';  // fire-lit underside
    ctx.beginPath(); ctx.ellipse(mx, baseY + 2, wTot * 0.58, 5 * scale, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a0b08';
    for (let i = 0; i < n; i++){                                          // heaped tops
      const bias = 1 - Math.abs(i - (n - 1) / 2) / (n / 2 + 0.5);
      const w = (16 + hash(seed + 5, m * 9 + i) * 18) * scale * (0.7 + bias * 0.5);
      const h = (10 + hash(seed + 6, m * 9 + i) * 20) * scale * (0.45 + bias * 0.75);
      const ox = (i - (n - 1) / 2) * wTot / n;
      ctx.beginPath(); ctx.ellipse(mx + ox, baseY - h * 0.62, w, h, 0, 0, 7); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(mx, baseY - 3 * scale, wTot * 0.55, 4.5 * scale, 0, 0, 7); ctx.fill(); // the flat floor
  }
}
function stratus(seed){

  const spanW = VW + 800;
  for (let s = 0; s < 2; s++){
    const x = ((hash(seed, s) * spanW - frame * (0.07 + s * 0.04) - cam.x * 0.025) % spanW + spanW) % spanW - 400;
    const y = VH * (0.44 + s * 0.06 + hash(seed + 1, s) * 0.03);
    const len = 300 + hash(seed + 2, s) * 300;
    const th = 6 + hash(seed + 3, s) * 6;
    ctx.fillStyle = 'rgba(224,100,40,' + (0.10 + hash(seed + 5, s) * 0.08).toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(x + len / 2, y + th * 0.5, len * 0.52, th * 0.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(20,9,7,.8)';

function drawSprite(img, x, y, flip){
  ctx.save();
  if (flip){ ctx.translate(x + img.width, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); }
  else ctx.drawImage(img, x, y);
  ctx.restore();
}
function enemyAnchor(e, img){
  return {x: e.x + e.w / 2 - img.width / 2 - cam.x, y: e.y + e.h - img.height};
}
const ENSPR = {L:'levy', H:'hound', B:'brigand', a:'imp', W:'wraith', C:'cult'};
function enemyVariant(e){
  if (e.kind === 'L') return (e.t / 12 | 0) % 2;
  if (e.kind === 'H') return e.st === 'windup' ? 2 : (e.t / (e.st === 'charge' ? 4 : 8) | 0) % 2;
  if (e.kind === 'B') return (e.st === 'raise' || e.st === 'hurl') ? 'raise' : e.st === 'swing' ? 'swing' : (e.t / 14 | 0) % 2 ? 'walk2' : 'walk1';
  if (e.kind === 'a') return e.st === 'leap' ? 1 : 0;
  if (e.kind === 'W') return (frame / 10 | 0) % 2;
  return e.st === 'raise' ? 'raise' : (e.t / 16 | 0) % 2 ? 'walk2' : 'walk1';
}
function drawEnemies(){
  for (const e of enemies){
    if (e.dead) continue;
    const variant = enemyVariant(e);
    let img = spr(ENSPR[e.kind], variant);
    const a = enemyAnchor(e, img);
    if (a.x < -120 || a.x > VW + 120) continue;
    if (e.kind !== 'W'){ // contact shadow pins them to the floor
      ctx.fillStyle = 'rgba(10,5,3,.4)';
      ctx.beginPath(); ctx.ellipse(e.x + e.w / 2 - cam.x, e.y + e.h + 3, e.w / 2.1, 4, 0, 0, 7); ctx.fill();
    }
    if (e.flashW > 0) img = sprWhite(ENSPR[e.kind], variant);
    if (e.kind === 'W') ctx.globalAlpha = 0.9;
    drawSprite(img, a.x, a.y, e.dir < 0);
    ctx.globalAlpha = 1;
    if (((e.kind === 'B' && (e.st === 'raise' || e.st === 'hurl')) || (e.kind === 'L' && e.st === 'poise')
        || (e.kind === 'H' && e.st === 'windup') || (e.kind === 'C' && e.st === 'raise'))
        && (e.stT / 4 | 0) % 2){ // telegraph blink
      ctx.fillStyle = 'rgba(255,180,80,.6)';
      ctx.fillRect(a.x + (e.dir > 0 ? img.width - 8 : 2), a.y - 6, 6, 6);
    }
  }
  for (const c of corpses){
    const key = ENSPR[c.kind], fr = c.fr;
    const img = c.ash ? sprAsh(key, fr) : (c.t < 3 ? sprWhite(key, fr) : spr(key, fr));
    ctx.save();
    ctx.translate(c.x - cam.x + img.width / 2, c.y + img.height / 2);
    ctx.rotate(c.rot);
    ctx.globalAlpha = Math.max(0, 1 - c.t / 110);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

    if (s.type === 'axe'){
      ctx.save(); ctx.translate(s.x + 7 - cam.x, s.y + 7); ctx.rotate(s.t * 0.28 * Math.sign(s.vx));
      ctx.fillStyle = '#544838'; ctx.fillRect(-2, -8, 4, 16);
      ctx.fillStyle = '#8f8a7a'; ctx.fillRect(-9, -8, 8, 7);
      ctx.fillStyle = '#c9c4b4'; ctx.fillRect(-9, -8, 2, 7);
      ctx.restore();
    } else flame(s.x + 5 - cam.x, s.y + 5, 5, 3, false);
  }

    flame(f.x + 6 - cam.x, f.y + 6, 7, 1, false);
  }

function drawPlayer(){
  const p = player;
  if (p.inv > 0 && !p.dead && (p.inv / 4 | 0) % 2) return;
  let pose = 'idle';
  if (p.plunge) pose = 'jump';
  else if (p.atk > 0 || p.cast > 0) pose = 'slash';
  else if (!p.onGround) pose = 'jump';
  else if (Math.abs(p.vx) > 0.4) pose = (p.animT / 0.55 | 0) % 2 ? 'run1' : 'run2';
  let img = spr('hero', pose, stage);
  if (p.redFlash > 0) img = tinted(img, 'rgba(220,60,50,0.9)');
  if (transform && transform.t >= 65 && transform.t < 68) img = sprWhite('hero', pose, stage);
  const cx = p.x + p.w / 2 - cam.x;
  const dx = cx - img.width / 2 + (p.dir > 0 ? 4 : -4);
  const dy = p.y + p.h - img.height;
  if (p.dead){
    ctx.save();
    ctx.translate(cx, dy + img.height / 2);
    ctx.rotate(p.deadT * 0.12 * p.dir);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
    return;
  }
  drawSprite(img, dx, dy, p.dir < 0);
  // slash arc flash (front, up for the riser)
  if (p.atk > 8 && p.atk < 13){
    ctx.strokeStyle = 'rgba(255,245,220,.85)'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (p.atkUp) ctx.arc(cx, p.y + 2, 26, Math.PI * 1.15, Math.PI * 1.85);
    else {
      const ax = p.dir > 0 ? p.x + p.w + 16 - cam.x : p.x - 16 - cam.x;
      ctx.arc(ax, p.y + 20, 22, p.dir > 0 ? -1.2 : Math.PI - 1.0, p.dir > 0 ? 1.0 : Math.PI + 1.2); // sweeps past horizontal
    }
    ctx.stroke();
  }
  // plunge: Brand held point-down beneath him
  if (p.plunge){
    ctx.fillStyle = '#e8dcc2'; ctx.fillRect(cx - 2, p.y + p.h - 8, 3, 26);
    ctx.fillStyle = '#a08a5c'; ctx.fillRect(cx + 1, p.y + p.h - 8, 2, 26);
    ctx.fillStyle = '#c2762e'; ctx.fillRect(cx - 7, p.y + p.h - 10, 13, 3);
  }
  // lantern ceremony: he lifts it to the flame, holds, lowers it -- still dark
  if (p.ceremony > 0){
    const c = p.ceremony;
    const lift = c > 34 ? (50 - c) / 16 : c > 16 ? 1 : c / 16;   // up, hold, down
    const ly = p.y + 26 - lift * 24;
    ctx.fillStyle = '#160d08';
    ctx.fillRect(cx + p.dir * (10 + lift * 8), ly, 8, 10);
    ctx.fillStyle = '#443019';
    ctx.fillRect(cx + p.dir * (10 + lift * 8) + 2, ly - 3, 4, 3);
  }
  // the visor casts light as the inner fire grows
  if (stage >= 1){
    const rr = 24 + stage * 16;
    const g = ctx.createRadialGradient(cx + p.dir * 8, p.y + 12, 3, cx + p.dir * 8, p.y + 12, rr);
    g.addColorStop(0, 'rgba(255,190,110,' + (0.05 + stage * 0.035) + ')'); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - rr - 10, p.y + 12 - rr, rr * 2 + 20, rr * 2);
  }
  // transformation shockwave ring
  if (transform && transform.wave){
    ctx.strokeStyle = 'rgba(255,200,120,' + Math.max(0, 1 - transform.wave / 220) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(cx, p.y + p.h / 2, transform.wave, 0, 7); ctx.stroke();
  }
}

    ctx.fillStyle = '#8a95a8'; ctx.fillRect(18, 68, 30, 4);
    ctx.fillStyle = '#c2762e'; ctx.fillRect(14, 67, 5, 6);
    for (let i = 0; i < maxEmbers; i++){
      ctx.fillStyle = i < embers ? '#ffb347' : '#2a2018';
      ctx.beginPath(); ctx.arc(56 + i * 12, 70, 4, 0, 7); ctx.fill();
    }
  }
  // xp + stage
  text('XP ' + xp + (stage > 0 ? '   ·   ' + STAGE_NAMES[stage] : ''), 18, 96, 14, '#c8a05c', 'left');
  text('' + coins, 60, 118, 14, '#c8a05c', 'left');
  ctx.fillStyle = '#c8a05c'; ctx.beginPath(); ctx.ellipse(46, 113, 6, 7, 0, 0, 7); ctx.fill();
  const secs = playTime / 60 | 0;
  text((secs / 60 | 0) + ':' + ('0' + secs % 60).slice(-2), VW - 20, 28, 15, '#c8b490', 'right');
  // last-heart tension: the world holds its breath
  if (player.hp === 1 && !player.dead){
    const pulse = 0.05 + 0.04 * Math.sin(frame * 0.09);
    ctx.fillStyle = 'rgba(160,58,40,' + pulse + ')';
    ctx.fillRect(0, 0, VW, VH);
    if (frame % 72 === 0){ AU.tone(52, 48, 0.1, 'sine', 0.16); AU.tone(52, 46, 0.09, 'sine', 0.13, AU.ctx && AU.ctx.currentTime + 0.18); }
    if (AU.mGain) AU.mGain.gain.value = 0.05;
  } else if (AU.mGain && AU.mGain.gain.value !== 0.14) AU.mGain.gain.value = 0.14;
  // toasts
  toasts.forEach((tt, i) => {
    ctx.globalAlpha = tt.t < 20 ? tt.t / 20 : tt.t > 120 ? Math.max(0, (150 - tt.t) / 30) : 1;
    text(tt.txt, VW / 2, VH - 64 - i * 24, 17, '#e8d9b0');
  });
  ctx.globalAlpha = 1;
}
function scanlines(){
  ctx.fillStyle = 'rgba(0,0,0,.06)';
  for (let y = 0; y < VH; y += 4) ctx.fillRect(0, y, VW, 2);
}
function vignette(dark){
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.95);
  g.addColorStop(0, 'rgba(10,5,3,0)'); g.addColorStop(1, 'rgba(10,5,3,' + (dark || 0.45) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}
function drawWorld(){
  ctx.save();
  if (cam.shake > 0) ctx.translate((Math.random() - 0.5) * cam.shake, (Math.random() - 0.5) * cam.shake);
  drawSky(); drawParallax();
  if (window.EW_BG_ONLY){ ctx.restore(); return; } // art-review mode: backdrop only
  drawTiles(); drawDecor(); drawCheckpoints();
  drawItems(); drawEnemies();
  if (transform && transform.t < 65){
    ctx.fillStyle = 'rgba(10,5,3,.4)'; ctx.fillRect(-10, -10, VW + 20, VH + 20);
  }
  drawPlayer(); drawFx();
  ctx.restore();
  if (transform && transform.t >= 65 && transform.t < 68){   // the moment the ember takes
    ctx.fillStyle = 'rgba(255,240,210,.55)'; ctx.fillRect(0, 0, VW, VH);
  }
  vignette();
}

//======================================================================
// SCREENS
//======================================================================
function ornament(x, y, w, color){
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x - 16, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 16, y); ctx.lineTo(x + w / 2, y); ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillRect(-5, -5, 10, 10); ctx.restore();
  ctx.fillRect(x - w / 2 - 3, y - 3, 6, 6); ctx.fillRect(x + w / 2 - 3, y - 3, 6, 6);
}
function titleScreen(){
  cam.x = (cam.x + 0.35) % (LW * TS - VW);
  drawSky(); drawParallax(); drawTiles(); drawDecor(); scanlines();
  ctx.fillStyle = 'rgba(12,6,4,.5)'; ctx.fillRect(0, 0, VW, VH);
  const bob = Math.sin(frame * 0.04) * 5;
  ornament(VW / 2, 128 + bob, 460, '#8a6a3a');
  text('EMBERWARD', VW / 2, 218 + bob, 92, '#e8b23a');
  text('A  T A L E   O F   C A L D E R M A R K', VW / 2, 258 + bob, 17, '#c8956a');
  ornament(VW / 2, 288 + bob, 460, '#8a6a3a');
  drawSprite(spr('hero', 'idle', 0), VW / 2 - 38, 330 + Math.sin(frame * 0.07) * 4, false);
  if ((frame / 32 | 0) % 2) text('PRESS ENTER TO KEEP THE FLAME', VW / 2, 452, 22, '#f3ead6');
  text('ARROWS move   SPACE jump   X sword   ↑+X skyward cut   ↓+X in air plunge   JUMP+X rising strike', VW / 2, 492, 14, '#a89878');
  text('M music     P pause' + (best.grade ? '     BEST GRADE ' + best.grade : ''), VW / 2, 514, 14, '#a89878');
}
function drawCard(){
  drawWorld(); scanlines();
  card.t++;
  const a = Math.min(1, card.t / 30) * (card.t > card.dur - 30 ? Math.max(0, (card.dur - card.t) / 30) : 1);
  ctx.fillStyle = 'rgba(12,6,4,' + 0.75 * a + ')'; ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = a;
  if (card.title) text(card.title, VW / 2, VH / 2 - 58, 30, '#e8b23a');
  card.lines.forEach((l, i) => text(l, VW / 2, VH / 2 + i * 34 - (card.title ? 0 : 20), 21, '#e8d9b0'));
  ctx.globalAlpha = 1;
  if (card.t > card.dur || (card.t > 40 && keys.startHit)){
    if (cardQueue.length){ card = cardQueue.shift(); }
    else {
      if (card.next === 'title' && act !== 0){ loadAct(0); resetLevel(false); }
      state = card.next; card = null;
    }
  }
}
function gradeScreen(){
  drawWorld(); scanlines();
  grade.t++;
  ctx.fillStyle = 'rgba(12,6,4,.7)'; ctx.fillRect(0, 0, VW, VH);
  ornament(VW / 2, 108, 480, '#8a6a3a');
  text(ACTS[act].clear, VW / 2, 148, 28, '#e8b23a');
  text('HOW BRIGHTLY DID YOU BURN?', VW / 2, 178, 15, '#c8956a');
  const secs = grade.secs | 0;
  text('TIME  ' + (secs / 60 | 0) + ':' + ('0' + secs % 60).slice(-2), VW / 2, 216, 19, '#e8d9b0');
  text('THE FALLEN  ' + killCount + ' / ' + killTotal, VW / 2, 248, 19, '#e8d9b0');
  text('COALS SPENT  ' + deaths + '      BEST CHAIN  ' + bestChain, VW / 2, 280, 19, '#e8d9b0');
  text('BRAZIERS  ' + secrets + ' / ' + braziers.length + '      XP  ' + xp, VW / 2, 312, 19, '#c8a05c');
  if (grade.t > 40){
    const gs = grade.t < 48 ? 3 - (grade.t - 40) * 0.25 : 1;
    if (grade.t === 48){ shake(4); }
    ctx.save();
    ctx.translate(VW / 2, 392);
    ctx.scale(gs, gs);
    text(grade.letter, 0, 22, 84, grade.letter === 'S' ? '#ffd75e' : grade.letter === 'A' ? '#e8b23a' : '#c8b490');
    ctx.restore();
  }
  ornament(VW / 2, 452, 480, '#8a6a3a');
  if (grade.t > 70 && (frame / 30 | 0) % 2) text('PRESS ENTER', VW / 2, 496, 18, '#f3ead6');
  if (grade.t > 70 && keys.startHit){
    if (act === 0){ // eastward, into the dead city
      loadAct(1); resetLevel(false, true);
      card = {title: ACTS[1].name, lines: ACTS[1].quote, t: 0, dur: 280, next: 'play'};
      state = 'card';
    } else {
      card = {title: '', lines: ['TO BE CONTINUED', 'ACT III — THE HUNGRY LIGHT'], t: 0, dur: 240, next: 'title'};
      state = 'card';
    }
  }
}
function gameoverScreen(){
  drawWorld(); scanlines();
  ctx.fillStyle = 'rgba(12,6,4,.78)'; ctx.fillRect(0, 0, VW, VH);
  text('The lantern is empty.', VW / 2, 236, 30, '#c8b490');
  text('The wind takes the rest.', VW / 2, 278, 22, '#8a7a64');
  text('XP  ' + xp + (best.xp ? '      BEST  ' + best.xp : ''), VW / 2, 336, 19, '#c8a05c');
  if ((frame / 30 | 0) % 2) text('PRESS ENTER', VW / 2, 408, 18, '#f3ead6');
  if (keys.startHit){
    if (act !== 0){ loadAct(0); resetLevel(false); }
    state = 'title';
  }
}

//======================================================================
// MAIN LOOP
//======================================================================
loadAct(0);
resetLevel(false);
state = 'title';
let acc = 0, last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  acc += Math.min(now - last, 100); last = now;
  while (acc >= 1000 / 60){ acc -= 1000 / 60; frameStep(); }
}
function frameStep(){
  frame++;
  if (state === 'title'){
    titleScreen();
    if (keys.startHit){
      resetLevel(false);
      // the premise, told to the player -- then the act card
      card = {lines: ['The King’s Coal warmed all Caldermark.', 'Its Warden was sworn to tend it.'], t: 0, dur: 220, next: 'play'};
      cardQueue = [
        {lines: ['He stopped. It fed on him instead.', 'Then it fed on the kingdom.'], t: 0, dur: 220, next: 'play'},
        {lines: ['One knight lived. His lantern, empty.', 'He marches east to take back the fire.'], t: 0, dur: 220, next: 'play'},
        {title: 'ACT I — THE ASH HARVEST', lines: ['The wind carried it east.', 'So he walked east.'], t: 0, dur: 240, next: 'play'},
      ];
      state = 'card';
    }
  } else if (state === 'card'){
    drawCard();
  } else if (state === 'play'){
    if (keys.pauseHit) paused = !paused;
    if (!paused){
      if (hitstop > 0){ hitstop--; }
      else {
        updateTransform();
        pendingSteps += timeScale;
        while (pendingSteps >= 1){
          pendingSteps--;
          playTime++;
          updatePlayer(); updateEnemies(); updateItems(); updateFx(); updateCrumble();
        }
        updateCamera();
        maybeLevelUp();
      }
    }
    drawWorld();
    if (!window.EW_BG_ONLY){ drawHUD(); scanlines(); }
    if (paused){
      ctx.fillStyle = 'rgba(12,6,4,.55)'; ctx.fillRect(0, 0, VW, VH);
      text('PAUSED', VW / 2, VH / 2, 44, '#f3ead6');
    }
  } else if (state === 'grade'){
    gradeScreen();
  } else if (state === 'gameover'){
    gameoverScreen();
  }
  keys.jumpHit = keys.atkHit = keys.castHit = keys.startHit = keys.pauseHit = false;
}
requestAnimationFrame(tick);

// headless-playtest hooks (no gameplay effect)
window.EW = {
  get state(){ return state; }, set state(s){ state = s; },
  get player(){ return player; }, get enemies(){ return enemies; }, get shots(){ return shots; },
  get xp(){ return xp; }, set xp(v){ xp = v; }, get stage(){ return stage; },
  get hasCoal(){ return hasCoal; }, get embers(){ return embers; }, get items(){ return items; },
  get frame(){ return frame; }, get grid(){ return grid; }, get cam(){ return cam; },
  get act(){ return act; }, get braziers(){ return braziers; }, get censers(){ return censers; },
  get triggers(){ return triggers; }, get card(){ return card; }, get checkpoints(){ return checkpoints; },
  get crumbled(){ return crumbled; }, get AU(){ return AU; },
  keys, spr, swordBox, loadAct, resetLevel,
  warp(x, y){ player.x = x; if (y !== undefined) player.y = y; player.vy = 0;
    cam.x = Math.max(0, Math.min(x - VW * 0.38, LW * TS - VW)); },
};
</script>
<!-- GAME END -->
